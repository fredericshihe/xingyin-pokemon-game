<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting…</title>
    <script>
      (function () {
        var path = location.pathname || '/';
        var search = location.search || '';
        var hash = location.hash || '';
        if (path.indexOf('/xingyin-pokemon-game') === 0) {
          var rest = path.slice('/xingyin-pokemon-game'.length) || '/';
          if (!rest.startsWith('/')) rest = '/' + rest;
          location.replace(rest + search + hash);
          return;
        }
        if (path === '/' || path === '/index.html') {
          location.replace('/' + search + hash);
          return;
        }
        location.replace('/?p=' + encodeURIComponent(path + search + hash));
      })();
    </script>
  </head>
  <body></body>
</html>
