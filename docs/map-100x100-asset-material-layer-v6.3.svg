  <g id="panel" transform="translate(1000 104)">
    <rect class="panel" x="0" y="0" width="710" height="900" rx="10"/>
    <text class="panel-head" x="24" y="36">图例与执行说明</text>

    <g transform="translate(24 64)">
      <circle class="asset ft" cx="12" cy="12" r="10"/><text class="swatch-label" x="30" y="16">FT fantasy town：前哨、农田、石路、水车</text>
      <circle class="asset gy" cx="12" cy="42" r="10"/><text class="swatch-label" x="30" y="46">GY graveyard：幽林旧遗迹、灯笼、铁栅、少量墓碑</text>
      <circle class="asset pf" cx="12" cy="72" r="10"/><text class="swatch-label" x="30" y="76">PF platformer：山脊高差、废场箱桶、岩台、视觉机关</text>
      <circle class="asset bc" cx="12" cy="102" r="10"/><text class="swatch-label" x="30" y="106">BC blocky characters：训练师、商人、钓手、研究员</text>
      <circle class="asset pr" cx="12" cy="132" r="10"/><text class="swatch-label" x="30" y="136">PR pirate：码头、船、桶瓶、棕榈、海岸生活带</text>
      <circle class="asset hx" cx="12" cy="162" r="10"/><text class="swatch-label" x="30" y="166">HX hexagon：桥、矿场、农场、港口、远景地标</text>
      <circle class="asset nt" cx="12" cy="192" r="10"/><text class="swatch-label" x="30" y="196">NT nature：树、花、草、蘑菇、水边自然基底</text>
      <circle class="asset sv" cx="12" cy="222" r="10"/><text class="swatch-label" x="30" y="226">SV survival：营火、帐篷、工具、木料、箱桶</text>
    </g>

    <line class="rule" x1="24" y1="322" x2="686" y2="322"/>
    <text class="panel-subhead" x="24" y="352">密度策略</text>
    <text class="panel-text" x="24" y="378">第一版建议 240-300 个实例，完整视觉版 320-420 个实例。</text>
    <text class="panel-text" x="24" y="402">每个 20x20 区块至少有两类内容；安全空地只留在 S、O、H、桥头和转弯视线区。</text>
    <text class="panel-text" x="24" y="426">主路每 6-10 格有小变化，每 18-25 格有一个可记忆地标。</text>

    <text class="panel-subhead" x="24" y="474">摆放逻辑</text>
    <text class="panel-text" x="24" y="500">B 区：岩台、瀑布、水车和断梯沿坡脚成层，不在山顶随机撒点。</text>
    <text class="panel-text" x="24" y="524">E/J 区：船、码头、桶瓶、船桨都贴水岸，方向顺水流和靠岸线。</text>
    <text class="panel-text" x="24" y="548">F/I 区：摊位、围栏、车和 NPC 面向道路，中心保持可读和可通行。</text>
    <text class="panel-text" x="24" y="572">H 区：只做旧遗迹被森林吞没的感觉，不把全区变成墓园。</text>
    <text class="panel-text" x="24" y="596">K 区：越靠 Boss 越密，危险物只做视觉边界，未接机关前不伤害玩家。</text>

    <text class="panel-subhead" x="24" y="644">当前项目接入风险</text>
    <text class="panel-text" x="24" y="670">当前 `ThreeLowPolyMap.jsx` 只加载少量 `kenney-nature` 模型别名。</text>
    <text class="panel-text" x="24" y="694">新增资源必须先进入 `public/assets/3d/kenney-*`，再注册模型 URL、别名和 footprint。</text>
    <text class="panel-text" x="24" y="718">不要在地图数据中直接引用 `/Users/shihe/Downloads/...`，浏览器无法稳定加载。</text>
    <text class="panel-text" x="24" y="742">大型模型必须检查遮挡、碰撞、缩放、桥头净空和移动端性能。</text>

    <text class="panel-subhead" x="24" y="790">暂缓使用</text>
    <text class="panel-text" x="24" y="816">`coin/heart/star/jewel` 不作为地图奖励。</text>
    <text class="panel-text" x="24" y="840">`crypt/coffin/ship-ghost/tower-complete` 只留给后续支线或 Boss 后伏笔。</text>
    <text class="panel-text" x="24" y="864">六边形整片地表不直接铺进方格地图，只做地标或规划参考。</text>
  </g>
</svg>
