  <rect class="page" width="1760" height="1160"/>
  <text class="title" x="48" y="42">100x100 地图素材层设计稿 V6.3：扩展 Kenney 资源摆放规划</text>
  <text class="subtitle" x="48" y="68">已核实下载目录 6 个新增素材包：fantasy town、graveyard、platformer、blocky characters、pirate、hexagon。此图只做规划，不代表已接入实际地图代码。</text>

