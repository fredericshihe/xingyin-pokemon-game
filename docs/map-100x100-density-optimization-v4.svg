  <g id="panel" transform="translate(920 104)">
    <rect class="panel" x="0" y="0" width="750" height="820" rx="10"/>
    <text class="head" x="22" y="34">密度审查结论</text>

    <rect class="panel-orange" x="22" y="56" width="706" height="122" rx="8"/>
    <text class="subhead" x="42" y="82">V3 还能优化的地方</text>
    <text class="txt" x="42" y="106">1. 地标素材够了，但“中小型填充素材”还偏少，落地时容易出现一团装饰后中间空。</text>
    <text class="txt" x="42" y="128">2. 湿地 -> 农田、花坡 -> 湿地、岩场 -> 河口这些生态交界还需要 2-3 格过渡带。</text>
    <text class="txt" x="42" y="150">3. 东岸和岩场有较长边界，应该多用棕榈、沙石、破木板、金属板做节奏点。</text>

    <rect class="panel-green" x="22" y="196" width="706" height="236" rx="8"/>
    <text class="subhead" x="42" y="222">D1-D10 建议新增密度带</text>
    <text class="txt" x="42" y="246">D1 北部山脊：碎石带 + 松树幼株 + hanging_moss，遮住山脚直线感。</text>
    <text class="txt" x="42" y="268">D2 湿地入口：芦草、睡莲、浅水石、木栈道碎段，让 B1 后不是大片空绿地。</text>
    <text class="txt" x="42" y="290">D3 东岸：棕榈、小沙石、独木舟、桶瓶和鱼架，海湾边缘形成连续生活痕迹。</text>
    <text class="txt" x="42" y="312">D4 采木高地：木桩、原木堆、树干、斧头，按树线外侧排列，不堵次路。</text>
    <text class="txt" x="42" y="334">D5 前哨周边：箱桶和围栏呈半环，中心保留安全空地，外圈连接道路。</text>
    <text class="txt" x="42" y="356">D6 蘑菇幽林：蘑菇组、暗色树、苔藓和隐藏箱，密度高但留一条清晰小径。</text>
    <text class="txt" x="42" y="378">D7 农田边界：田垄、破栅栏、水桶、工具和草丛，避免农田看成纯色矩形。</text>
    <text class="txt" x="42" y="400">D8 河口钓营：鱼、鱼架、瓶、箱、睡袋、营火，围绕水边和小营地摆。</text>
    <text class="txt" x="42" y="422">D9 岩场废场：矿石、镐锤、金属板、旧地板，按“矿洞外堆料场”排列。</text>

    <rect class="panel-blue" x="22" y="450" width="706" height="172" rx="8"/>
    <text class="subhead" x="42" y="476">遇敌区继续优化</text>
    <text class="txt" x="42" y="500">保留 V3 的 Z01-Z14，再建议新增四个小型过渡遇敌区：</text>
    <text class="txt" x="42" y="522">+Z15 山脊草窝：岩石缝和松树幼株之间，低概率。</text>
    <text class="txt" x="42" y="544">+Z16 东岸沙草：码头外侧和棕榈线之间，低到中概率。</text>
    <text class="txt" x="42" y="566">+Z17 农田外缘：围栏外草丛，不进入田垄主路。</text>
    <text class="txt" x="42" y="588">+Z18 岩场洞口草：矿洞/废场交界，作为后段探索区。</text>
    <text class="txt" x="42" y="610">这样总遇敌区从 14 个变成 18 个，密度更稳，但主路仍然安全。</text>

    <text class="head" x="22" y="664">落地密度目标</text>
    <text class="txt" x="22" y="692">代表性大/中素材：V3 约 73 个，执行版建议 110-130 个，其中 30-40 个为小型填充素材。</text>
    <text class="txt" x="22" y="716">每个 20x20 区块至少满足两项：道路/水体/遇敌区/素材簇/边界地形。安全空地例外。</text>
    <text class="txt" x="22" y="740">小素材不要随机撒，按“水边线、坡脚线、道路外缘、营地外圈、农田边界、矿洞外堆料场”成线或半环摆放。</text>
    <text class="txt" x="22" y="764">避免过密：主路中心 1-2 格、桥头 2 格、玩家出生和前哨中心保持清爽，保证移动和读图。</text>
  </g>

  <g id="legend" transform="translate(48 960)">
    <rect class="panel" x="0" y="0" width="1622" height="104" rx="10"/>
    <text class="head" x="22" y="32">图例</text>
    <rect class="heat-hi" x="90" y="18" width="28" height="20"/><text class="txt" x="128" y="33">高密度：林下、湿地、岩场，可多放小素材和遇敌草</text>
    <rect class="heat-mid" x="90" y="50" width="28" height="20"/><text class="txt" x="128" y="65">中密度：路边、农田外缘、山脚，需要规律素材簇</text>
    <rect class="heat-low" x="560" y="18" width="28" height="20"/><text class="txt" x="598" y="33">低密度：安全空地、视线开阔区、桥头缓冲，允许留白</text>
    <path class="density d-stone" d="M560 64H610"/><text class="txt" x="622" y="68">灰线：碎石/岩壁密度带</text>
    <path class="density d-plant" d="M790 64H840"/><text class="txt" x="852" y="68">绿线：灌木/花/蘑菇/草密度带</text>
    <path class="density d-water" d="M1040 64H1090"/><text class="txt" x="1102" y="68">蓝线：水边生活/湿地素材带</text>
    <path class="density d-camp" d="M1260 64H1310"/><text class="txt" x="1322" y="68">棕线：营地/农田/采木资源带</text>
  </g>
</svg>
