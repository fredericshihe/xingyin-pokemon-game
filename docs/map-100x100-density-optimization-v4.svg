  <text class="title" x="48" y="40">100x100 扩展地图资源密度优化 V4：在 V3 基础上补“微装饰”和生态过渡</text>
  <text class="subtitle" x="48" y="66">结论：V3 已经可用，但落地前建议再加一层小素材密度和过渡带。此图不是改实际地图，只是把仍可优化的位置标出来。</text>

