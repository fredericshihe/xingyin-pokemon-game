  <g id="panel" transform="translate(950 104)">
    <rect class="panel" x="0" y="0" width="760" height="860" rx="10"/>
    <text class="head" x="22" y="34">综合设计说明</text>

    <rect class="panel-green" x="22" y="56" width="716" height="116" rx="8"/>
    <text class="subhead" x="42" y="82">地图结构</text>
    <text class="txt" x="42" y="106">主路：S 出生营地 -> 旧东口 -> B1 湿地桥 -> O 前哨 -> 农田/河口 -> B2 岩场。</text>
    <text class="txt" x="42" y="128">次路：旧南口 -> 采木高地 -> 蘑菇幽林 -> 农田，形成低中等级练级环线。</text>
    <text class="txt" x="42" y="150">小径：瀑布源、隐藏箱、河口钓营、岩洞口、东岸码头，用道具和稀有生态牵引探索。</text>

    <rect class="panel-blue" x="22" y="190" width="716" height="142" rx="8"/>
    <text class="subhead" x="42" y="216">玩法点</text>
    <text class="txt" x="42" y="240">G1/G2/G3：三名部下训练师，分别守草坡、幽林、湖岸，击败 3/3 后解锁 Boss。</text>
    <text class="txt" x="42" y="262">B：迷雾首领 Boss，推荐放在岩场/金属废场深处，队伍 6 只，是本章节最高难度。</text>
    <text class="txt" x="42" y="284">T1-T6：普通训练师，提供探索节奏，不参与 Boss 解锁。</text>
    <text class="txt" x="42" y="306">I/?：可见道具和隐藏点；C：连战挑战；H：限制次数恢复点；W：瀑布源/未来地图入口。</text>

    <rect class="panel-orange" x="22" y="350" width="716" height="142" rx="8"/>
    <text class="subhead" x="42" y="376">宝可梦生态</text>
    <text class="txt" x="42" y="400">Z01-Z18：随机野生区域，共 67 只候选，按草坡、湿地、东岸、采木、幽林、农田、岩洞、金属场分布。</text>
    <text class="txt" x="42" y="422">隐藏/奖励：三御家、传说、化石、3D龙、拉普拉斯、卡比兽、迷你龙等 18 只不普通随机。</text>
    <text class="txt" x="42" y="444">进化专属：最终形态、伊布分支、高阶分支进化等 59 只只通过成长/任务/道具获得。</text>
    <text class="txt" x="42" y="466">进度档位：tier_0 默认，tier_1 击败 1 部下，tier_2 击败 3 部下，tier_3 击败 Boss。</text>

    <rect class="panel-red" x="22" y="510" width="716" height="126" rx="8"/>
    <text class="subhead" x="42" y="536">必须先处理的实现风险</text>
    <text class="txt" x="42" y="560">1. 先完成 100x100 扩图和旧存档位置兼容，再铺训练师、Boss、道具和稀有草丛。</text>
    <text class="txt" x="42" y="582">2. 修正 `getSpeciesLevelBounds()` 对无进化物种的 max=-1 误判，否则野生表会跳过合法物种。</text>
    <text class="txt" x="42" y="604">3. 大型装饰物必须写入碰撞或占用格，主路/桥/前哨中心不得被装饰遮挡。</text>
    <text class="txt" x="42" y="626">4. 奖励不直接发金币，地图奖励以精灵球、药水、经验药水、隐藏宝可梦或进度标记为主。</text>

    <text class="head" x="22" y="688">标记图例</text>
    <text class="txt" x="22" y="716">S 出生营地，O 补给前哨，H 恢复点，C 连战挑战，B Boss，G 部下，T 普通训练师。</text>
    <text class="txt" x="22" y="740">B1/B2/B3 桥位，I 可见道具，? 隐藏点，W 瀑布源或未来连接入口。</text>
    <text class="txt" x="22" y="764">绿色虚线区为遇敌区域；黄色虚线区为安全留白，允许保持开阔但不触发随机战斗。</text>

    <text class="head" x="22" y="812">文件用途</text>
    <text class="txt" x="22" y="840">本图用于综合设计审稿；实际落地应拆成 mapGrid、encounterZones、mapGameplay、decorativeObjects 和事件配置。</text>
  </g>
</svg>
