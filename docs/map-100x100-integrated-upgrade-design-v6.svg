  <rect class="page" width="1760" height="1160"/>
  <text class="title" x="48" y="40">100x100 综合地图升级设计稿 V6：地形、生态、玩法点和进度系统合并版</text>
  <text class="subtitle" x="48" y="66">旧 44x36 地图保留在左上角；新增区域向东、向南扩展。主路负责章节推进，支路负责探索，道具/训练师/Boss/稀有生态按进度逐步打开。</text>

