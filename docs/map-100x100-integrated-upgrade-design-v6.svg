<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1160" viewBox="0 0 1760 1160" role="img" aria-labelledby="title desc">
  <title id="title">100x100 综合地图升级设计稿 V6</title>
  <desc id="desc">整合 100x100 地形、道路、资源密度、宝可梦生态、训练师、Boss、道具、隐藏奖励和进度档位的可视化地图设计稿。</desc>
  <defs>
