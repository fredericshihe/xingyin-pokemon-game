    <text class="label" x="396" y="206">C 石花坡</text>
    <text class="label" x="444" y="344">D 月镜湿地</text>
    <text class="label" x="738" y="190">E 东岸海湾</text>
    <text class="label" x="286" y="348">F 生存补给前哨</text>
