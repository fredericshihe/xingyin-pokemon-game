<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1060" viewBox="0 0 1680 1060" role="img" aria-labelledby="title desc">
  <title id="title">100x100 宝可梦生态遇敌规划 V5</title>
  <desc id="desc">基于当前 144 只图鉴，把随机野生、隐藏奖励和进化专属宝可梦分配到 100x100 地图生态区。</desc>
  <defs>
    <style>
      .page { fill: #f6f7ef; }
      .title { font: 800 27px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; letter-spacing: 0; }
      .subtitle { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; letter-spacing: 0; }
      .map { fill: #dceec6; stroke: #172033; stroke-width: 3; }
      .grid { stroke: rgba(15,23,42,.12); stroke-width: 1; }
      .old { fill: #96d67b; stroke: #064e3b; stroke-width: 2.4; }
      .ridge { fill: #aeb8a3; }
      .flower { fill: #cfe98b; }
      .wetland { fill: #9ddfc2; }
      .coast { fill: #c5e8dc; }
      .pine { fill: #80ba71; }
      .outpost { fill: #dac47f; }
      .mushroom { fill: #609861; }
      .farm { fill: #d9e88b; }
      .delta { fill: #b7ddbc; }
      .quarry { fill: #d1a36c; }
      .water { fill: none; stroke: #64cfe0; stroke-width: 24; stroke-linecap: round; stroke-linejoin: round; opacity: .9; }
      .road { fill: none; stroke: #e5bf76; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .trail { fill: none; stroke: #2f8f54; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1 8; }
      .zone { fill: rgba(255,255,255,.76); stroke: #0f172a; stroke-width: 1; }
      .zone-hot { fill: rgba(220,252,231,.82); stroke: #166534; stroke-width: 1.2; }
      .zone-rare { fill: rgba(255,247,237,.86); stroke: #c2410c; stroke-width: 1.2; }
      .label { font: 800 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; letter-spacing: 0; }
      .small { font: 10px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; letter-spacing: 0; }
      .tiny { font: 9px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; letter-spacing: 0; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; }
      .panel-green { fill: #eef8e8; stroke: #9acb8c; stroke-width: 1.2; }
      .panel-blue { fill: #eaf8fb; stroke: #7fc7d7; stroke-width: 1.2; }
      .panel-orange { fill: #fff7ed; stroke: #fdba74; stroke-width: 1.2; }
      .head { font: 800 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; letter-spacing: 0; }
      .subhead { font: 800 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; letter-spacing: 0; }
      .txt { font: 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; letter-spacing: 0; }
      .metric { font: 800 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; letter-spacing: 0; }
    </style>
  </defs>

  <rect class="page" width="1680" height="1060"/>
  <text class="title" x="48" y="40">100x100 宝可梦生态遇敌规划 V5：144 只图鉴全覆盖</text>
  <text class="subtitle" x="48" y="66">绿色区为随机野生生态；橙色说明为隐藏/奖励/进化专属。普通主路、桥头、前哨中心仍保持安全，不触发随机遇敌。</text>

