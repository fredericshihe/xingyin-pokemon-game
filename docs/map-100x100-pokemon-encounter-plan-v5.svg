    <path class="delta" d="M528 730C560 656 556 594 524 544C594 516 672 544 728 610C756 694 718 794 656 860H458C498 832 520 782 528 730Z"/>
    <path class="quarry" d="M728 498C780 540 820 564 860 568V860H656C724 782 756 660 728 498Z"/>

    <path class="water" d="M522 66C514 114 498 142 490 176C482 212 492 240 526 272C570 314 638 312 690 342C744 372 758 430 738 488C718 554 752 618 788 690C814 742 800 800 764 850"/>
    <path class="water" stroke-width="16" d="M274 172C338 176 400 206 464 248C490 264 512 274 536 280"/>
