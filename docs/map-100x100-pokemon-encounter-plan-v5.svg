    <path class="trail" d="M174 430C230 470 288 470 344 442"/>
    <path class="trail" d="M420 554C372 612 356 672 380 736"/>

    <g id="zones">
      <rect class="zone-hot" x="44" y="38" width="154" height="56" rx="6"/><text class="label" x="56" y="58">Z01 阳光草坡</text><text class="small" x="56" y="76">宝宝丁/喵喵/尼多朗</text>
      <rect class="zone-hot" x="206" y="88" width="150" height="54" rx="6"/><text class="label" x="218" y="108">Z02 花丘</text><text class="small" x="218" y="126">魔尼尼/蛋蛋/凯西</text>
      <rect class="zone-hot" x="400" y="182" width="168" height="60" rx="6"/><text class="label" x="412" y="202">Z03 石花坡</text><text class="small" x="412" y="220">盆才怪/小拳石/飞天螳螂</text>
      <rect class="zone-hot" x="548" y="90" width="164" height="56" rx="6"/><text class="label" x="560" y="110">Z04/Z15 山脊</text><text class="small" x="560" y="128">独角犀牛/大岩蛇/幼基拉斯</text>
      <rect class="zone-hot" x="500" y="356" width="170" height="60" rx="6"/><text class="label" x="512" y="376">Z05 湿地</text><text class="small" x="512" y="394">可达鸭/呆呆兽/墨海马</text>
      <rect class="zone-hot" x="710" y="302" width="136" height="62" rx="6"/><text class="label" x="722" y="322">Z06/Z16 东岸</text><text class="small" x="722" y="340">大钳蟹/大舌贝/海星星</text>
      <rect class="zone-hot" x="68" y="390" width="172" height="58" rx="6"/><text class="label" x="80" y="410">Z07 采木高地</text><text class="small" x="80" y="428">腕力/猴怪/卡蒂狗</text>
      <rect class="zone-hot" x="210" y="474" width="162" height="58" rx="6"/><text class="label" x="222" y="494">Z08 虫林边缘</text><text class="small" x="222" y="512">飞天螳螂/大甲/无畏小子</text>
      <rect class="zone-hot" x="54" y="654" width="164" height="60" rx="6"/><text class="label" x="66" y="674">Z09 蘑菇幽林</text><text class="small" x="66" y="692">鬼斯/催眠貘/臭泥</text>
      <rect class="zone-hot" x="334" y="604" width="166" height="60" rx="6"/><text class="label" x="346" y="624">Z10/Z17 农田</text><text class="small" x="346" y="642">喵喵/嘟嘟/吉利蛋</text>
      <rect class="zone-hot" x="596" y="700" width="156" height="58" rx="6"/><text class="label" x="608" y="720">Z11 河口</text><text class="small" x="608" y="738">鲤鱼王/海刺龙/哥达鸭</text>
      <rect class="zone-hot" x="704" y="604" width="138" height="62" rx="6"/><text class="label" x="716" y="624">Z12/Z18 岩洞</text><text class="small" x="716" y="642">隆隆石/豪力/沙基拉斯</text>
      <rect class="zone-hot" x="692" y="512" width="150" height="58" rx="6"/><text class="label" x="704" y="532">Z13 金属场</text><text class="small" x="704" y="550">小磁怪/霹雳电球/瓦斯弹</text>
      <rect class="zone-hot" x="704" y="208" width="142" height="58" rx="6"/><text class="label" x="716" y="228">Z14 背风草带</text><text class="small" x="716" y="246">肯泰罗/小火马/袋兽</text>
      <rect class="zone-rare" x="304" y="360" width="170" height="58" rx="6"/><text class="label" x="316" y="380">F 前哨安全区</text><text class="small" x="316" y="398">无随机遇敌，可放任务奖励</text>
    </g>
  </g>

  <g id="panel" transform="translate(950 104)">
    <rect class="panel" x="0" y="0" width="680" height="860" rx="10"/>
    <text class="head" x="22" y="34">图鉴覆盖结果</text>

    <rect class="panel-green" x="22" y="56" width="636" height="94" rx="8"/>
    <text class="metric" x="42" y="92">67</text><text class="subhead" x="92" y="86">随机野生候选</text>
    <text class="txt" x="92" y="110">基础形态、低中阶段、生态合理的独立种。</text>
    <text class="txt" x="92" y="132">每区只选 5-8 个核心物种，保留区域记忆。</text>

    <rect class="panel-orange" x="22" y="170" width="636" height="94" rx="8"/>
    <text class="metric" x="42" y="206">18</text><text class="subhead" x="92" y="200">固定隐藏 / 奖励 / 任务</text>
    <text class="txt" x="92" y="224">三御家、传说、化石初始、拉普拉斯、卡比兽、3D龙、迷你龙等。</text>
    <text class="txt" x="92" y="246">不进入普通随机表，用事件保证稀有感。</text>

    <rect class="panel-blue" x="22" y="284" width="636" height="94" rx="8"/>
    <text class="metric" x="42" y="320">59</text><text class="subhead" x="92" y="314">进化 / 分支进化专属</text>
    <text class="txt" x="92" y="338">最终形态、伊布分支、高阶交易/道具进化、准神最终等。</text>
    <text class="txt" x="92" y="360">主要靠成长、道具、训练或支线解锁。</text>

    <text class="head" x="22" y="428">保留为隐藏或奖励的重点</text>
    <text class="txt" x="22" y="456">开局/老师：#1 妙蛙种子、#2 小火龙、#3 杰尼龟。</text>
    <text class="txt" x="22" y="480">剧情/道路：#9 拉普拉斯、#10 卡比兽、#33 蚊香泳士、#40 白海狮。</text>
    <text class="txt" x="22" y="504">化石/研究：#24 化石翼龙、#65 3D龙、#81 菊石兽、#82 化石盔。</text>
    <text class="txt" x="22" y="528">隐藏终局：#25 火焰鸟、#26 急冻鸟、#27 闪电鸟、#68 超梦、#69 梦幻。</text>
    <text class="txt" x="22" y="552">龙潭：#128 迷你龙，后续进化为 #129 哈克龙、#12 快龙。</text>

    <text class="head" x="22" y="616">落地注意</text>
    <text class="txt" x="22" y="644">1. 先修 `getSpeciesLevelBounds()` 的 `null -> 0` 过滤问题，否则独立种和最终形态会被误判为 max=-1。</text>
    <text class="txt" x="22" y="668">2. 新增 11 张区域表，不再让全部区域共用 `route102_grass`。</text>
    <text class="txt" x="22" y="692">3. 强生态种如幼基拉斯、沙基拉斯、吉利蛋、袋兽，总权重控制在 3-5。</text>
    <text class="txt" x="22" y="716">4. 三御家、传说、伊布进化、化石复原和 3D龙线不要普通随机野生。</text>
    <text class="txt" x="22" y="740">5. 固定 Boss 如暴鲤龙可以是水面事件，不放进普通草丛抽取。</text>

    <text class="head" x="22" y="804">完整明细</text>
    <text class="txt" x="22" y="832">详见 Markdown：docs/map-100x100-pokemon-encounter-plan-v5.md</text>
  </g>
</svg>
