    <path class="main" d="M46 270C130 263 203 221 282 159C347 113 419 144 468 193C516 241 547 263 550 293C556 347 531 388 430 404C416 482 422 536 440 581C468 662 546 724 646 713C690 739 717 776 720 810C740 729 767 637 803 565C789 594 783 619 790 648"/>
