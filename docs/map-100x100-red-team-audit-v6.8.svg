      .main { fill: none; stroke: #f59e0b; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .loop { fill: none; stroke: #2563eb; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 12 7; opacity: .9; }
      .risk { fill: #111827; stroke: #ffffff; stroke-width: 2.4; }
