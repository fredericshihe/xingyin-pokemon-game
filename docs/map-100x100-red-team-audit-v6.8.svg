      .risk-low { fill: #2563eb; stroke: #ffffff; stroke-width: 2.4; }
      .risk-text { font: 800 8px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; letter-spacing: 0; }
      .area { font: 900 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; letter-spacing: 0; }
      .small { font: 9px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; letter-spacing: 0; }
