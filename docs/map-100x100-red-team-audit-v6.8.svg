    <text class="area" x="28" y="32">A 旧图</text>
    <text class="area" x="520" y="35">B 北山脊</text>
    <text class="area" x="425" y="222">C 石花坡</text>
    <text class="area" x="560" y="370">D 湿地</text>
    <text class="area" x="790" y="250">E 东岸</text>
    <text class="area" x="355" y="408">F 前哨</text>
    <text class="area" x="94" y="430">G 采木</text>
    <text class="area" x="54" y="650">H 幽林</text>
    <text class="area" x="400" y="640">I 农田</text>
    <text class="area" x="610" y="780">J 河口</text>
    <text class="area" x="780" y="650">K 废场</text>

    <circle class="risk-hi" cx="184" cy="360" r="14"/><text class="risk-text" x="184" y="360">A01</text>
    <circle class="risk-hi" cx="640" cy="255" r="14"/><text class="risk-text" x="640" y="255">A02</text>
    <circle class="risk-hi" cx="165" cy="696" r="14"/><text class="risk-text" x="165" y="696">A03</text>
    <circle class="risk-hi" cx="430" cy="404" r="14"/><text class="risk-text" x="430" y="404">A04</text>
    <circle class="risk-mid" cx="550" cy="293" r="14"/><text class="risk-text" x="550" y="293">A05</text>
    <circle class="risk-mid" cx="646" cy="713" r="14"/><text class="risk-text" x="646" y="713">A06</text>
    <circle class="risk-mid" cx="610" cy="780" r="14"/><text class="risk-text" x="610" y="780">A07</text>
    <circle class="risk-mid" cx="803" cy="565" r="14"/><text class="risk-text" x="803" y="565">A08</text>
    <circle class="risk-mid" cx="790" cy="390" r="14"/><text class="risk-text" x="790" y="390">A09</text>
    <circle class="risk-mid" cx="520" cy="222" r="14"/><text class="risk-text" x="520" y="222">A10</text>
    <circle class="risk-low" cx="720" cy="810" r="14"/><text class="risk-text" x="720" y="810">A11</text>
    <circle class="risk-low" cx="850" cy="855" r="14"/><text class="risk-text" x="850" y="855">A12</text>
    <circle class="risk-low" cx="546" cy="70" r="14"/><text class="risk-text" x="546" y="70">A13</text>
    <circle class="risk-low" cx="360" cy="324" r="14"/><text class="risk-text" x="360" y="324">A14</text>
    <circle class="risk-low" cx="500" cy="585" r="14"/><text class="risk-text" x="500" y="585">A15</text>
    <circle class="risk-low" cx="830" cy="702" r="14"/><text class="risk-text" x="830" y="702">A16</text>
  </g>

  <g id="panel1" transform="translate(990 110)">
    <rect class="panel-red" x="0" y="0" width="520" height="358" rx="8"/>
    <text class="head" x="18" y="30">必须先修的结构矛盾</text>
    <text class="strong" x="22" y="64">A01 旧南口绕行：</text><text class="txt" x="142" y="64">可能跳过 B1/O 的进入节奏；旧南口只接低压采木回环。</text>
    <text class="strong" x="22" y="94">A02 G1 与 Z04 解锁：</text><text class="txt" x="166" y="94">G1 可走安全路，Z04 稀有草再 tier_1 开。</text>
    <text class="strong" x="22" y="124">A03 G2 与 Z09 tier_2：</text><text class="txt" x="172" y="124">G2 不能放在只有 tier_2 才开放的压力区。</text>
    <text class="strong" x="22" y="154">A04 前哨过载：</text><text class="txt" x="132" y="154">四向出口、NPC、补给、任务需要外圈分层。</text>
    <text class="strong" x="22" y="184">A05 桥头生态覆盖：</text><text class="txt" x="154" y="184">Z05 必须扣除 B1 桥头和隐藏入口。</text>
    <text class="strong" x="22" y="214">A06 H/C/B3 三点过近：</text><text class="txt" x="176" y="214">恢复、挑战、桥位必须各自有对话空间。</text>
    <text class="strong" x="22" y="244">A07 Z11 与 H：</text><text class="txt" x="112" y="244">河口营地可早到，但高压遇敌必须 tier_2 后增强。</text>
    <text class="strong" x="22" y="274">A08 B2 门槛：</text><text class="txt" x="126" y="274">需要明确挑战门和失败回退点。</text>
    <text class="txt" x="22" y="318">结论：这些不是美术问题，是执行前必须锁定的数据和路线规则。</text>

    <rect class="panel-orange" x="0" y="386" width="520" height="314" rx="8"/>
    <text class="head" x="18" y="416">第一版范围再收敛</text>
    <text class="strong" x="22" y="452">必须做：</text><text class="txt" x="84" y="452">黄金主路、三部下、Boss、tier_0/tier_1/tier_2、8 隐藏。</text>
    <text class="strong" x="22" y="482">暂缓做：</text><text class="txt" x="84" y="482">tier_3 完整稀有层、连战、探索面板、Boss 后再战。</text>
    <text class="strong" x="22" y="512">奖励预算：</text><text class="txt" x="96" y="512">经验药水数量要封顶，避免再出现经验爆表但不升级的体验。</text>
    <text class="strong" x="22" y="542">素材预算：</text><text class="txt" x="96" y="542">第一批 60-90 个别名即可，完整密度不能提前铺。</text>
    <text class="strong" x="22" y="572">遇敌预算：</text><text class="txt" x="96" y="572">主路安全旅行带优先于草丛密度。</text>
    <text class="strong" x="22" y="602">事件预算：</text><text class="txt" x="96" y="602">G1/G2/G3、Boss、8 道具、8 隐藏先闭环。</text>
    <text class="txt" x="22" y="646">第一版要像完整章节的骨架，不像完整大地图的未完成版本。</text>
  </g>

  <g id="panel2" transform="translate(1540 110)">
    <rect class="panel-blue" x="0" y="0" width="510" height="404" rx="8"/>
    <text class="head" x="18" y="30">可执行性审计</text>
    <text class="strong" x="22" y="64">A09 东岸主题边界：</text><text class="txt" x="168" y="64">PR 只做水岸可选探索，不进入主路判断。</text>
    <text class="strong" x="22" y="94">A10 第一隐藏教学：</text><text class="txt" x="168" y="94">HS03 要明确教“视觉异常可调查”。</text>
    <text class="strong" x="22" y="124">A11 B3 命名冲突：</text><text class="txt" x="154" y="124">B3 是桥，不是 Boss；图例和 UI 要避免误读。</text>
    <text class="strong" x="22" y="154">A12 边界空白：</text><text class="txt" x="142" y="154">东南角需要斜切、废结构、岩壁遮挡。</text>
    <text class="strong" x="22" y="184">A13 W 入口：</text><text class="txt" x="106" y="184">只做远景伏笔，不触发未完成传送。</text>
    <text class="strong" x="22" y="214">A14 旧存档：</text><text class="txt" x="118" y="214">若旧坐标落入新增阻挡物，要重定位到最近安全格。</text>
    <text class="strong" x="22" y="244">A15 农田到河口：</text><text class="txt" x="154" y="244">需要视线和路标，不让玩家误进幽林深处。</text>
    <text class="strong" x="22" y="274">A16 T5/Boss：</text><text class="txt" x="130" y="274">T5 不应挡 Boss 唯一路；放到侧场预热。</text>
    <text class="txt" x="22" y="318">每一项都要转成验收用例：能走、不会误触发、不会误读、能保存。</text>
    <text class="txt" x="22" y="350">V6.8 的价值不是更多玩法，而是提前消掉会返工的设计债。</text>

    <rect class="panel-green" x="0" y="432" width="510" height="268" rx="8"/>
    <text class="head" x="18" y="462">新的第一版验收口径</text>
    <line class="legend-line" x1="24" y1="494" x2="80" y2="494" stroke="#f59e0b"/><text class="txt" x="96" y="498">黄金主路全程不被随机遇敌、装饰和 NPC 打断。</text>
    <line class="legend-line" x1="24" y1="526" x2="80" y2="526" stroke="#2563eb" stroke-dasharray="12 7"/><text class="txt" x="96" y="530">可选环线能回主路，且不比主路更亮更宽。</text>
    <circle class="risk-hi" cx="52" cy="560" r="11"/><text class="risk-text" x="52" y="560">A</text><text class="txt" x="96" y="564">红色问题修完才进入素材铺设。</text>
    <circle class="risk-mid" cx="52" cy="592" r="11"/><text class="risk-text" x="52" y="592">A</text><text class="txt" x="96" y="596">橙色问题必须在第一版验收表中检查。</text>
    <circle class="risk-low" cx="52" cy="624" r="11"/><text class="risk-text" x="52" y="624">A</text><text class="txt" x="96" y="628">蓝色问题可以随实现逐步验证，但不能遗忘。</text>
    <text class="txt" x="22" y="666">一句话：先把地图变成“不会误导玩家”的系统，再让它变漂亮。</text>
  </g>

  <g id="bottom" transform="translate(48 1048)">
    <rect class="panel" x="0" y="0" width="2002" height="188" rx="8"/>
    <text class="head" x="18" y="32">V6.8 追加结论</text>
    <text class="txt" x="22" y="66">V6.7 的方向正确，但文档中仍有跨章节遗留矛盾：G2 与 Z09 的 tier 解锁、G1 与 Z04 的稀有草解锁、第一版范围缺 tier_1、旧南口可能绕过前哨，以及 H/C/B3 功能过近。</text>
    <text class="txt" x="22" y="96">V6.8 不是推翻 V6.7，而是把 V6.7 的“导演手”落实为数据约束：哪些路能走、哪些草什么时候触发、哪些内容第一版必须做，哪些只做伏笔。</text>
    <text class="txt" x="22" y="126">最终执行时，先做红色 A01-A08，再做橙色第一版预算，再做蓝色可执行性检查。这样地图不会因为美术丰富而在逻辑上返工。</text>
    <text class="txt" x="22" y="156">重点修订：Z09 改为外圈 tier_1、深处 tier_2；Z04 改为安全通路 tier_0、稀有草 tier_1；第一版纳入 tier_1，暂缓完整 tier_3。</text>
  </g>
</svg>
