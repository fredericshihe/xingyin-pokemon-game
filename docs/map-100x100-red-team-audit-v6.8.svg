      .ridge { fill: #b7bfae; }
      .wetland { fill: #9fe0c7; }
      .coast { fill: #bfe6dd; }
      .wood { fill: #83bc74; }
      .outpost { fill: #dfc97a; }
      .mushroom { fill: #659a67; }
      .farm { fill: #dfe98d; }
      .delta { fill: #b8dfbc; }
      .quarry { fill: #d5a16f; }
