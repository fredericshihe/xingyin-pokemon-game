      .panel-green { fill: #eef8e8; stroke: #9acb8c; stroke-width: 1.2; }
      .head { font: 800 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; letter-spacing: 0; }
      .txt { font: 10.4px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; letter-spacing: 0; }
      .strong { font: 800 10.4px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; letter-spacing: 0; }
      .legend-line { stroke-linecap: round; stroke-width: 5; }
    </style>
  </defs>

  <rect class="page" width="2100" height="1320"/>
  <text class="title" x="48" y="44">100x100 地图 V6.8 全量红队审计图：找会导致返工、迷路、失衡和实现冲突的问题</text>
  <text class="sub" x="48" y="70">A01-A16 是审计动作，不是新增玩法。红色必须先修，橙色第一版必须约束，蓝色可在实现时验证。</text>

