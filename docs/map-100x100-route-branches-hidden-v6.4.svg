  <rect class="page" width="1760" height="1160"/>
  <text class="title" x="48" y="42">100x100 道路分支与隐藏区域设计稿 V6.4：主路之外的探索路网</text>
  <text class="subtitle" x="48" y="68">主线负责推进，蓝色为区域环线，紫色为隐藏支路，橙色为奖励盲端，黄色虚线区为隐藏微区域。目标是让玩家始终能看到可探索的岔路。</text>

