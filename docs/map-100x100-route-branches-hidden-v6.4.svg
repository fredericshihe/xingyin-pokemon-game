  <g id="panel" transform="translate(1000 104)">
    <rect class="panel" x="0" y="0" width="710" height="900" rx="10"/>
    <text class="head" x="24" y="36">V6.4 路网设计说明</text>

    <rect class="panel-green" x="24" y="60" width="662" height="116" rx="8"/>
    <text class="subhead" x="44" y="86">核心修正</text>
    <text class="txt" x="44" y="110">上一版视觉上接近单主路推进。V6.4 改为 1 条章节主线、8 条区域环线、14 个隐藏微区域。</text>
    <text class="txt" x="44" y="132">环线负责探索后回到熟悉位置，奖励盲端负责短距离发现，未来入口只做伏笔不强行开放。</text>
    <text class="txt" x="44" y="154">每个大区至少有一个可识别支路入口，避免玩家只沿一条路从出生点走到 Boss。</text>

    <rect class="panel-blue" x="24" y="198" width="662" height="168" rx="8"/>
    <text class="subhead" x="44" y="224">图例</text>
    <line class="legend-line" x1="44" y1="250" x2="104" y2="250" stroke="#f2c670"/><text class="txt" x="118" y="254">主线：推进路线，宽、清晰、低迷路风险。</text>
    <line class="legend-line" x1="44" y1="278" x2="104" y2="278" stroke="#2563eb" stroke-dasharray="13 8"/><text class="txt" x="118" y="282">蓝色：区域环线，探索后能回到主路或前哨。</text>
    <line class="legend-line" x1="44" y1="306" x2="104" y2="306" stroke="#9333ea" stroke-dasharray="3 7"/><text class="txt" x="118" y="310">紫色：隐藏支路，通过素材异常和缺口提示。</text>
    <line class="legend-line" x1="44" y1="334" x2="104" y2="334" stroke="#f97316" stroke-dasharray="9 6"/><text class="txt" x="118" y="338">橙色：奖励盲端，长度短，尽头必须有内容。</text>

    <rect class="panel-purple" x="24" y="388" width="662" height="192" rx="8"/>
    <text class="subhead" x="44" y="414">8 条环线</text>
    <text class="txt" x="44" y="438">BR01 北山脊环：瀑布源、瞭望台、背风草带。</text>
    <text class="txt" x="44" y="460">BR02 湿地栈道环：芦苇迷径、月镜小岛、旧木桩道。</text>
    <text class="txt" x="44" y="482">BR03 东岸船骸环：码头、船骸湾、潮汐洞口。</text>
    <text class="txt" x="44" y="504">BR04 采木高地环：伐木场、树桩迷径、高地瞭望点。</text>
    <text class="txt" x="44" y="526">BR05 幽林遗迹环：灯笼小径、铁栅遗迹、蘑菇隐径。</text>
    <text class="txt" x="44" y="548">BR06-BR08：农田水渠、河口沙洲、岩场废场回环。</text>

    <rect class="panel-orange" x="24" y="602" width="662" height="164" rx="8"/>
    <text class="subhead" x="44" y="628">隐藏区规则</text>
    <text class="txt" x="44" y="652">第一版至少落地 8 个隐藏微区域，完整设计保留 14 个。</text>
    <text class="txt" x="44" y="674">隐藏入口不靠穿墙，必须通过灯笼、断栈道、石阶、船骸、花环、铁栅缺口等视觉提示。</text>
    <text class="txt" x="44" y="696">盲端长度控制在 5-14 格，超过 14 格就改成环线或增加中途景观点。</text>
    <text class="txt" x="44" y="718">隐藏支路不能覆盖桥面、前哨中心、恢复点中心和 Boss 开战点。</text>
    <text class="txt" x="44" y="740">Boss 后应至少新增 2 个回访理由：潮汐洞口、冶炼残址后门或废场控制台。</text>

    <text class="head" x="24" y="814">执行口径</text>
    <text class="txt" x="24" y="842">落地时先画主线，再画蓝色环线，最后放紫色隐藏支路和橙色盲端。</text>
    <text class="txt" x="24" y="866">每次加装饰后都要重跑可达性检查，确保支路入口没有被树、箱子、围栏或 NPC 堵住。</text>
  </g>
</svg>
