<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">新手流程电影式双段故事板 V1.2</title>
  <desc id="desc">删除信标第一幕，只保留伙伴共鸣和山谷启程，用电影过场镜头呈现课堂练琴、老师奖励和冒险启程。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="52%" stop-color="#164e63"/>
      <stop offset="100%" stop-color="#3f2f14"/>
    </linearGradient>
    <linearGradient id="film" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#eef7f6" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="valley" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="48%" stop-color="#bbf7d0"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#020617" flood-opacity="0.28"/>
    </filter>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing: 0; }
      .title { font-size: 38px; font-weight: 900; fill: #f8fafc; }
      .subtitle { font-size: 18px; font-weight: 700; fill: #cbd5e1; }
      .panel-title { font-size: 28px; font-weight: 900; fill: #0f172a; }
      .shot-title { font-size: 19px; font-weight: 900; fill: #0f172a; }
      .label { font-size: 14px; font-weight: 900; fill: #0f766e; }
      .small { font-size: 14px; font-weight: 750; fill: #475569; }
      .caption { font-size: 17px; font-weight: 850; fill: #f8fafc; }
      .tiny { font-size: 12px; font-weight: 750; fill: #64748b; }
      .panel { fill: url(#film); stroke: rgba(255,255,255,0.45); stroke-width: 1.5; filter: url(#shadow); }
      .shot { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.2; }
      .line { fill: none; stroke: #14b8a6; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .dash { fill: none; stroke: #fbbf24; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 8 9; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>
  <rect x="0" y="0" width="1600" height="74" fill="#020617" opacity="0.72"/>
  <rect x="0" y="906" width="1600" height="74" fill="#020617" opacity="0.72"/>

  <text x="78" y="64" class="title">新手流程电影式双段故事板 V1.2</text>
  <text x="80" y="106" class="subtitle">删除“信标第一幕”，只保留伙伴共鸣和山谷启程。规则说明变成台词、镜头和动画，不再像界面向导。</text>

  <g transform="translate(80 145)">
    <rect x="0" y="0" width="1440" height="332" rx="28" class="panel"/>
    <text x="34" y="48" class="panel-title">段落 A：伙伴共鸣</text>
    <text x="34" y="82" class="small">课堂与练琴的星光进入伙伴世界，学生轻触画面中的宝可梦完成选择。</text>

    <g transform="translate(34 112)">
      <rect x="0" y="0" width="250" height="170" rx="18" class="shot"/>
      <rect x="18" y="22" width="92" height="58" rx="12" fill="#e0f2fe"/>
      <rect x="30" y="105" width="152" height="34" rx="8" fill="#0f172a"/>
      <g transform="translate(38 111)">
        <rect x="0" y="0" width="20" height="26" rx="4" fill="#ffffff"/>
        <rect x="26" y="0" width="20" height="26" rx="4" fill="#ffffff"/>
        <rect x="52" y="0" width="20" height="26" rx="4" fill="#ffffff"/>
        <rect x="78" y="0" width="20" height="26" rx="4" fill="#ffffff"/>
      </g>
      <text x="18" y="154" class="shot-title">1 教室琴键</text>
    </g>

    <path d="M304 198 C328 186 352 186 376 198" class="line"/>

    <g transform="translate(386 112)">
      <rect x="0" y="0" width="250" height="170" rx="18" class="shot"/>
      <rect x="24" y="28" width="96" height="112" rx="14" fill="#fff7ed" stroke="#fed7aa"/>
      <path d="M42 55 H102 M42 78 H102 M42 101 H102" stroke="#c2410c" stroke-width="4" stroke-linecap="round"/>
      <circle cx="154" cy="52" r="10" fill="#fbbf24"/>
      <circle cx="182" cy="76" r="8" fill="#38bdf8"/>
      <circle cx="206" cy="104" r="10" fill="#22c55e"/>
      <path d="M120 118 C154 102 174 62 220 48" class="dash"/>
      <text x="18" y="154" class="shot-title">2 练琴日记</text>
    </g>

    <path d="M656 198 C680 186 704 186 728 198" class="line"/>

    <g transform="translate(738 112)">
      <rect x="0" y="0" width="250" height="170" rx="18" class="shot"/>
      <circle cx="70" cy="72" r="38" fill="#fef3c7" stroke="#fbbf24" stroke-width="5"/>
      <path d="M70 42 L78 65 L102 65 L82 79 L90 104 L70 89 L50 104 L58 79 L38 65 L62 65 Z" fill="#f59e0b"/>
      <path d="M110 76 C144 72 168 70 205 74" class="line"/>
      <circle cx="145" cy="73" r="14" fill="#facc15"/>
      <circle cx="178" cy="73" r="14" fill="#22c55e"/>
      <circle cx="210" cy="73" r="14" fill="#38bdf8"/>
      <text x="18" y="154" class="shot-title">3 老师奖励</text>
    </g>

    <path d="M1008 198 C1032 186 1056 186 1080 198" class="line"/>

    <g transform="translate(1090 112)">
      <rect x="0" y="0" width="302" height="170" rx="18" class="shot"/>
      <g transform="translate(28 48)">
        <circle cx="0" cy="0" r="22" fill="#f97316"/>
        <circle cx="58" cy="0" r="22" fill="#22c55e"/>
        <circle cx="116" cy="0" r="22" fill="#38bdf8"/>
        <circle cx="174" cy="0" r="22" fill="#facc15"/>
        <circle cx="232" cy="0" r="22" fill="#a16207"/>
      </g>
      <path d="M32 104 C110 82 190 82 268 104" fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round" opacity="0.45"/>
      <text x="18" y="154" class="shot-title">4 伙伴醒来并选择</text>
    </g>
  </g>

  <g transform="translate(80 520)">
    <rect x="0" y="0" width="1440" height="292" rx="28" class="panel"/>
    <text x="34" y="48" class="panel-title">段落 B：山谷启程</text>
    <text x="34" y="82" class="small">伙伴确认后，镜头跟随奖励光点和伙伴背影进入新手山谷。没有“启程按钮”，只有发光的小路。</text>

    <g transform="translate(34 112)">
      <rect x="0" y="0" width="310" height="138" rx="18" class="shot"/>
      <path d="M32 72 C100 42 176 44 262 70" class="dash"/>
      <rect x="210" y="50" width="54" height="54" rx="16" fill="#0f172a"/>
      <circle cx="58" cy="72" r="15" fill="#facc15"/>
      <circle cx="96" cy="58" r="15" fill="#22c55e"/>
      <circle cx="134" cy="52" r="15" fill="#38bdf8"/>
      <circle cx="172" cy="58" r="15" fill="#f97316"/>
      <text x="18" y="120" class="shot-title">1 奖励落入背包</text>
    </g>

    <path d="M366 180 C392 168 418 168 444 180" class="line"/>

    <g transform="translate(454 112)">
      <rect x="0" y="0" width="310" height="138" rx="18" class="shot"/>
      <rect x="0" y="0" width="310" height="138" rx="18" fill="url(#valley)" opacity="0.82"/>
      <path d="M28 110 C84 74 132 82 180 58 C220 38 250 34 286 28" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" opacity="0.55"/>
      <path d="M46 118 C104 86 140 82 188 62 C228 44 252 38 284 30" fill="none" stroke="#c08436" stroke-width="10" stroke-linecap="round"/>
      <text x="18" y="120" class="shot-title">2 镜头穿过云层</text>
    </g>

    <path d="M786 180 C812 168 838 168 864 180" class="line"/>

    <g transform="translate(874 112)">
      <rect x="0" y="0" width="250" height="138" rx="18" class="shot"/>
      <rect x="26" y="78" width="64" height="36" rx="8" fill="#dc2626"/>
      <path d="M46 78 L58 52 L70 78 Z" fill="#ef4444"/>
      <rect x="132" y="42" width="18" height="62" rx="5" fill="#a16207"/>
      <path d="M114 48 H168 L156 70 H126 Z" fill="#facc15"/>
      <path d="M184 104 C196 70 208 70 220 104" fill="#16a34a"/>
      <text x="18" y="120" class="shot-title">3 营地、路牌、草丛</text>
    </g>

    <path d="M1146 180 C1172 168 1198 168 1224 180" class="line"/>

    <g transform="translate(1234 112)">
      <rect x="0" y="0" width="158" height="138" rx="18" class="shot"/>
      <path d="M30 104 C60 76 96 54 128 32" fill="none" stroke="#c08436" stroke-width="16" stroke-linecap="round"/>
      <circle cx="96" cy="54" r="16" fill="#fbbf24"/>
      <circle cx="96" cy="54" r="30" fill="none" stroke="#fbbf24" stroke-width="4" opacity="0.45"/>
      <text x="20" y="120" class="shot-title">4 轻触小路</text>
    </g>
  </g>

  <text x="112" y="886" class="caption">底部字幕示例：星音导师：这些不是凭空出现的奖励，它们来自你真实完成的努力。</text>
</svg>
