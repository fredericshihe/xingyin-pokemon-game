const calculateDamage = (attacker, defender, move) => {
  if (move.category === 'status') return 0;

  // Simple Formula: ((2 * Level / 5 + 2) * Power * A / D) / 50 + 2
  const level = attacker.level || 50; // Use monster's level, with a fallback
  const a = move.category === 'physical' ? attacker.atk : attacker.spAtk;
  const d = move.category === 'physical' ? defender.def : defender.spDef;

  let damage = (2 * level / 5 + 2) * move.power * (a / d) / 50 + 2;

  // Type Effectiveness
  const effectiveness = getEffectiveness(move.type, defender.type);
  damage *= effectiveness;

  // STAB (Same Type Attack Bonus)
  if (move.type === attacker.type) damage *= 1.5;

  // Random variance 0.85 - 1.00
  damage *= (Math.floor(Math.random() * 16) + 85) / 100;

  return { damage: Math.floor(damage), effectiveness };
};

const getExpToNextLevel = (level) => {
  if (level >= 100) return Infinity; // Cap level at 100
  // Quadratic formula: XP = 10 * level^2
  // Level 1: 10 XP, Level 2: 40 XP, Level 3: 90 XP, Level 4: 160 XP
  // This formula ensures faster early leveling and then slows down.
  return Math.floor(10 * Math.pow(level, 2));
};

const createMonsterInstance = (baseMonster, level, id, initialCurrentHp, initialCurrentMp, initialCurrentExp) => {
  // Defensive check to prevent crash if baseMonster is not found (e.g., during level-up)
  if (!baseMonster) {
    console.error(`createMonsterInstance received an undefined 'baseMonster'. This likely means a monster lookup failed, possibly during level-up. ID passed: ${id}.`);
    // Return a fallback monster to prevent a crash.
    baseMonster = {
      id: 0, name: '错误宝可梦', type: 'normal', moves: ['tackle'],
      sprite: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/0.png',backSprite: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/back/0.png',
      stats: { hp: 10, attack: 10, defense: 10, sp_attack: 10, sp_defense: 10, speed: 10 }
    };
  }

  // Data normalization to handle different structures (MONSTERS vs BALANCED_MONSTERS)
  const baseStats = baseMonster.stats ? { // From BALANCED_MONSTERS
    maxHp: baseMonster.stats.hp,
    maxMp: Math.floor((baseMonster.stats.sp_attack || 50) * 0.8) + 20, // Calculate MP
    atk: baseMonster.stats.attack,
    def: baseMonster.stats.defense,
    spAtk: baseMonster.stats.sp_attack,
    spDef: baseMonster.stats.sp_defense,
    spd: baseMonster.stats.speed
  } : { // From MONSTERS
    maxHp: baseMonster.maxHp,
    maxMp: baseMonster.maxMp,
    atk: baseMonster.atk,
    def: baseMonster.def,
    spAtk: baseMonster.spAtk,
    spDef: baseMonster.spDef,
    spd: baseMonster.spd
  };

  // Fallback for any missing stat to prevent NaN
  const safeStat = (val) => val || 0;

  // Simplified stat calculation based on Pokemon formulas
  const calculatedStats = {
    maxHp: Math.floor(2 * safeStat(baseStats.maxHp) * level / 100 + level + 10),
    maxMp: Math.floor(2 * safeStat(baseStats.maxMp) * level / 100 + 5),
    atk: Math.floor(2 * safeStat(baseStats.atk) * level / 100 + 5),
    def: Math.floor(2 * safeStat(baseStats.def) * level / 100 + 5),
    spAtk: Math.floor(2 * safeStat(baseStats.spAtk) * level / 100 + 5),
    spDef: Math.floor(2 * safeStat(baseStats.spDef) * level / 100 + 5),
    spd: Math.floor(2 * safeStat(baseStats.spd) * level / 100 + 5)
  };

  // Ensure HP is at least 1
  if (calculatedStats.maxHp <= 0) calculatedStats.maxHp = 1;

  return {
    ...baseMonster,
    ...calculatedStats,
    level,
    id,
    baseId: baseMonster.id, // Keep track of the original monster template ID
    currentHp: initialCurrentHp ?? calculatedStats.maxHp,
    currentMp: initialCurrentMp ?? calculatedStats.maxMp,
    currentExp: initialCurrentExp ?? 0,
    expToNextLevel: getExpToNextLevel(level)
  };
};

// --- Error Boundary ---
class ErrorBoundary extends Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, error: null, errorInfo: null };
  }
  static getDerivedStateFromError(error) {
    return { hasError: true, error };
  }
  componentDidCatch(error, errorInfo) {
    console.error("ErrorBoundary caught:", error, errorInfo);
    this.setState({ errorInfo });
    // Send error to parent frame for debugging
    window.parent.postMessage({
      type: 'spark-app-error',
      error: {
        message: error.toString(),
        stack: error.stack,
        componentStack: errorInfo.componentStack
      }
    }, '*');
  }
  render() {
    if (this.state.hasError) {
      return (
        <div className="h-screen flex items-center justify-center p-4 bg-red-900/90 text-white font-mono">
          <div className="max-w-2xl bg-black/50 p-6 rounded-xl border border-red-500/30">
            <div className="flex items-center gap-3 mb-4 text-red-400">
              <i className="fa-solid fa-triangle-exclamation text-2xl"></i>
              <h2 className="text-xl font-bold">Runtime Error</h2>
            </div>
            <div className="text-sm space-y-2">
              <p className="text-red-300 font-bold">{this.state.error?.toString()}</p>
              {this.state.error?.stack &&
              <pre className="text-xs text-slate-300 overflow-auto max-h-64 bg-black/30 p-3 rounded">
                  {this.state.error.stack}
                </pre>
              }
            </div>
          </div>
        </div>);

    }
    return this.props.children;
  }
}

const ProgressBar = ({ current, max, color = "bg-green-500" }) => {
  const percent = Math.max(0, Math.min(100, current / max * 100));
  let barColor = color;
  // 仅对生命条应用危险色预警逻辑
  if (color === "bg-green-500") {
    if (percent < 50) barColor = "bg-yellow-500";
    if (percent < 20) barColor = "bg-red-500";
  }

  return (
    <div className="w-full bg-gray-700 h-2 rounded-sm border border-gray-600 relative overflow-hidden">
            <div
        className={`h-full ${barColor} transition-all duration-500 ease-out`}
        style={{ width: `${percent}%` }}>
      </div>
            {/* Gloss effect */}
            <div className="absolute top-0 left-0 w-full h-0.5 bg-white opacity-20"></div>
        </div>);
};

/**
 * Generates a maze with a single exit using an iterative randomized DFS algorithm.
 * @param {number} width - The width of the maze.
 * @param {number} height - The height of the maze.
 * @returns {Array<Array<number>>} A 2D array representing the maze (0=path, 1=wall, 2=exit).
 */


const TILE_CLASSES = {
  0: 'bg-pattern-grass', // 普通草地
  1: 'bg-pattern-tree shadow-inner', // 树木墙壁
  2: 'bg-pattern-flower', // 出口花丛
  3: 'bg-pattern-grass', // 道具地块
  4: 'bg-pattern-grass', // 金币地块
  5: 'bg-pattern-grass', // 治疗点
  6: 'bg-pattern-grass', // 告示牌
  7: 'bg-pattern-grass', // 训练家
  8: 'bg-pattern-tall-grass', // 高草丛 (遇敌率高)
  9: 'bg-pattern-grass', // 果树背景
  10: 'bg-pattern-grass', // 商人背景
  11: 'bg-pattern-water shadow-pixel-inset', // 水域 (不可通行)
  12: 'bg-pattern-sand' // 沙地 (移动减速)
};
const TILE_SIZE = 32; // size of a tile in pixels // size of a tile in pixels
const ENCOUNTER_RATE = 0.15; // 15% chance
const PLAYER_SPRITE_URL = 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/132.png'; // 默认使用百变怪作为替身

const LEVEL_MAPS = {}; // Cache for level maps

const generateMaze = (width, height, levelId = 1) => {
  // If we already have a map for this level, return it (Persistence)
  if (LEVEL_MAPS[levelId]) {
    return LEVEL_MAPS[levelId];
  }

  // 初始化全为普通草地(0)
  const grid = Array.from({ length: height }, () => Array(width).fill(0));

  // 1. 生成边界墙壁
  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      if (x === 0 || x === width - 1 || y === 0 || y === height - 1) grid[y][x] = 1;
    }
  }

  // 2. 团块地形生成逻辑 (使地形面积更大且合理)
  const addTerrainCluster = (type, count, radius, density = 0.7) => {
    for (let i = 0; i < count; i++) {
      const cx = Math.floor(Math.random() * (width - 4)) + 2;
      const cy = Math.floor(Math.random() * (height - 4)) + 2;
      for (let y = Math.max(1, cy - radius); y <= Math.min(height - 2, cy + radius); y++) {
        for (let x = Math.max(1, cx - radius); x <= Math.min(width - 2, cx + radius); x++) {
          const dist = Math.sqrt(Math.pow(x - cx, 2) + Math.pow(y - cy, 2));
          if (dist <= radius && Math.random() < density) {
            // 只有普通草地或同类型才能被覆盖，避免破坏边界
            if (grid[y][x] === 0 || (type === 8 && grid[y][x] === 0)) grid[y][x] = type;
          }
        }
      }
    }
  };

  // 生成大面积地形：树林(1)、高草丛(8)、沙地(12)、水域(11)
  addTerrainCluster(1, 2, 2, 0.6);   // 少量树林簇作为自然屏障
  addTerrainCluster(8, 3, 3, 0.8);   // 3大块高草丛区域
  addTerrainCluster(12, 1, 4, 0.7);  // 1块大面积沙地区域
  addTerrainCluster(11, 1, 2, 0.9);  // 1个小型湖泊

  // 3. 确保核心路径连通性
  grid[1][1] = 0; grid[1][2] = 0; grid[2][1] = 0; // 起点安全
  grid[height - 2][width - 2] = 2; // 终点出口

  // 4. 放置交互点 (必须放置在普通草地 0 上)
  const placeOnEmpty = (type, count) => {
    let placed = 0;
    let attempts = 0;
    while (placed < count && attempts < 100) {
      const ry = Math.floor(Math.random() * (height - 2)) + 1;
      const rx = Math.floor(Math.random() * (width - 2)) + 1;
      if (grid[ry][rx] === 0) {
        grid[ry][rx] = type;
        placed++;
      }
      attempts++;
    }
  };

  // 随机放置道具(3)和金币(4)
  placeOnEmpty(3, 3);
  placeOnEmpty(4, 3);
  // 随机放置治疗点(5)
  placeOnEmpty(5, 1);
  // 随机放置告示牌(6)
  placeOnEmpty(6, 2);
  // 随机放置训练家(7)
  placeOnEmpty(7, 2);
  // 随机放置果树(9)
  placeOnEmpty(9, 2);
  // 随机放置神秘商人(10)
  placeOnEmpty(10, 1);

  // Cache the generated grid
  LEVEL_MAPS[levelId] = grid;
  return grid;
};

    const eTypes = [enemyMon.type, enemyMon.type2].filter(Boolean);

    pTypes.forEach(pType => {

        maxPlayerAdv = Math.max(maxPlayerAdv, getEffectiveness(pType, eType));
      });
    });

    let maxEnemyAdv = 0;
    eTypes.forEach(eType => {
      pTypes.forEach(pType => {
        maxEnemyAdv = Math.max(maxEnemyAdv, getEffectiveness(eType, pType));

const MapScreen = ({ playerTeam, onEncounter, onNavigate, onCollect, playerPos, onPlayerMove }) => {
  const [isMoving, setIsMoving] = useState(false);
  const [isTeleporting, setIsTeleporting] = useState(false);

  const handleMove = useCallback((dx, dy) => {
    if (isMoving) return;

    // Safety check for MAP_GRID
    if (!MAP_GRID || !MAP_GRID.length) return;

    const newX = playerPos.x + dx;
    const newY = playerPos.y + dy;

    if (
    newY >= 0 && newY < MAP_GRID.length &&
    newX >= 0 && newX < MAP_GRID[0].length &&
    MAP_GRID[newY][newX] !== 1 && // Not a wall
    MAP_GRID[newY][newX] !== 11    // Not water
    ) {
      const tileType = MAP_GRID[newY][newX];

      // Check for Items (3) or Gold (4)
      if (tileType === 3 || tileType === 4) {
        MAP_GRID[newY][newX] = 0; // Remove from map
        if (onCollect) {
          if (tileType === 3) {
            onCollect('item', 1); // The value '1' is a placeholder for quantity
          } else {
            onCollect('gold', 50);
          }
        } else {
          // Fallback for when onCollect is not provided
          if (tileType === 3) {
            alert("获得: 随机道具 (需完善App逻辑以保存)");
          } else {
            alert("获得: 50 金币 (需完善App逻辑以保存)");
          }
        }
      }

      // Check for Heal (5)
      if (tileType === 5) {
        if (onCollect) onCollect('heal');
      }

      // Check for Info (6)
      if (tileType === 6) {
        if (onCollect) onCollect('info');
      }

      // Check for Trainer (7)
      if (tileType === 7) {
        if (onCollect) onCollect('trainer');
        MAP_GRID[newY][newX] = 0; // Remove trainer from map
        return; // Bump interaction, do not move player onto tile
      }

      // Check for Berries (9)
      if (tileType === 9) {
        MAP_GRID[newY][newX] = 0;
        if (onCollect) onCollect('berry');
      }

      // Check for Merchant (10)
      if (tileType === 10) {
        if (onCollect) onCollect('merchant');
        MAP_GRID[newY][newX] = 0;
        return;
      }

      // Check for exit (Tile type 2)
      if (tileType === 2) {
        onNavigate('levelSelect');
        return;
      }

      setIsMoving(true);
      onPlayerMove({ x: newX, y: newY });

      // Trigger encounter check
      const currentTile = MAP_GRID[newY][newX];
      let currentEncounterRate = 0;
      if (currentTile === 0) currentEncounterRate = ENCOUNTER_RATE;
      if (currentTile === 8) currentEncounterRate = ENCOUNTER_RATE * 2.5; // Tall grass has much higher rate

      if (currentEncounterRate > 0) {
        if (Math.random() < currentEncounterRate) {
          // Dynamic Level Scaling
          const leadLevel = (playerTeam && playerTeam[0]) ? (playerTeam[0].level || 5) : 5;
          const randomOffset = Math.floor(Math.random() * 5) - 1;
          const suggestedWildLevel = Math.max(1, leadLevel + randomOffset);

          setTimeout(() => onEncounter(suggestedWildLevel, currentTile), 300);
        }
      }

      // Movement delay logic (Sand slows down)
      const moveDelay = currentTile === 12 ? 400 : 200;
      setTimeout(() => setIsMoving(false), moveDelay);
    }
  }, [playerPos, isMoving, onEncounter, onCollect, onPlayerMove]);

  // Keyboard controls
  useEffect(() => {
    const handleKeyDown = (e) => {
      if (e.key === 'ArrowUp') handleMove(0, -1);
      else if (e.key === 'ArrowDown') handleMove(0, 1);
      else if (e.key === 'ArrowLeft') handleMove(-1, 0);
      else if (e.key === 'ArrowRight') handleMove(1, 0);
    };
    window.addEventListener('keydown', handleKeyDown);
    return () => window.removeEventListener('keydown', handleKeyDown);
  }, [handleMove]);

  // Safe check for map grid
  if (!MAP_GRID || !MAP_GRID.length) return <div className="text-white">Loading Map...</div>;

  return (
    <div className="h-full flex flex-col bg-black relative p-2 pt-safe pb-safe gap-2">
            {/* Map View */}
            <div className="flex-1 flex items-center justify-center overflow-hidden">
                <div
          className="relative border-4 border-gray-700 shadow-pixel overflow-hidden bg-black"
          style={{
            width: '100%',
            height: '100%',
            maxWidth: `calc((100vh - 180px) * ${MAP_GRID[0].length / MAP_GRID.length})`,
            maxHeight: 'calc(100vh - 180px)',
            aspectRatio: `${MAP_GRID[0].length}/${MAP_GRID.length}`
          }}>

                    <div className="absolute inset-0 grid" style={{ gridTemplateColumns: `repeat(${MAP_GRID[0].length}, 1fr)` }}>
                        {MAP_GRID.flat().map((tile, index) =>
            <div key={index} className={`w-full h-full ${TILE_CLASSES[tile] || TILE_CLASSES[0]} relative flex items-center justify-center overflow-visible`}>
                                {tile === 3 && ( // Item
                                    <div className="flex flex-col items-center justify-center scale-110">
                                        <i className="fa-solid fa-gift text-red-600 drop-shadow-[0_2px_2px_rgba(0,0,0,0.5)] animate-bounce" style={{ fontSize: '14px', transform: 'translateY(-2px)' }}></i>
                                        <div className="w-3.5 h-1 bg-black/30 rounded-full blur-[1px] -mt-0.5"></div>
                                    </div>
                                )}
                                {tile === 4 && ( // Gold
                                    <div className="flex flex-col items-center justify-center scale-110">
                                        <i className="fa-solid fa-coins text-yellow-400 drop-shadow-[0_2px_2px_rgba(0,0,0,0.5)] animate-pulse" style={{ fontSize: '14px', transform: 'translateY(-2px)' }}></i>
                                        <div className="w-3.5 h-1 bg-black/30 rounded-full blur-[1px] -mt-0.5"></div>
                                    </div>
                                )}
                                {tile === 5 && ( // Heal
                                    <div className="flex flex-col items-center justify-center scale-125">
                                        <div className="absolute -top-1 right-0 w-2 h-2 bg-white rounded-full animate-ping opacity-75"></div>
                                        <i className="fa-solid fa-house-chimney-medical text-pink-500 drop-shadow-[0_2px_4px_rgba(0,0,0,0.5)]" style={{ fontSize: '18px', transform: 'translateY(-3px)' }}></i>
                                        <div className="w-5 h-1.5 bg-black/40 rounded-full blur-[2px] -mt-0.5"></div>
                                    </div>
                                )}
                                {tile === 6 && ( // Info
                                    <div className="flex flex-col items-center justify-center">
                                        <i className="fa-solid fa-signs-post text-amber-800 drop-shadow-[0_2px_2px_rgba(0,0,0,0.5)]" style={{ fontSize: '18px', transform: 'translateY(-2px)' }}></i>
                                        <div className="w-5 h-1 bg-black/30 rounded-full blur-[1px] -mt-0.5"></div>

                                {tile === 7 && ( // Trainer
                                    <div className="flex flex-col items-center justify-center scale-110">
                                        <i className="fa-solid fa-user-ninja text-red-600 drop-shadow-[0_3px_3px_rgba(0,0,0,0.6)] animate-bounce" style={{ fontSize: '18px', transform: 'translateY(-4px)' }}></i>
                                        <div className="w-5 h-1.5 bg-black/50 rounded-full blur-[2px] -mt-0.5"></div>
                                    </div>
                                )}
                                {tile === 9 && ( // Berry
                                    <div className="flex flex-col items-center justify-center scale-110">
                                        <i className="fa-solid fa-apple-whole text-orange-500 drop-shadow-[0_1px_2px_rgba(0,0,0,0.4)]" style={{ fontSize: '16px', transform: 'translateY(-2px)' }}></i>
                                        <div className="w-3.5 h-1 bg-black/20 rounded-full blur-[1px] -mt-0.5"></div>
                                    </div>
                                )}
                                {tile === 10 && ( // Merchant
                                    <div className="flex flex-col items-center justify-center scale-110">

const TeamScreen = ({ team = [], onSelect, activeId, onBack, playerInventory = [], onUsePotion, onReorderTeam }) => {
  const [selectedMonsterForPotion, setSelectedMonsterForPotion] = useState(null);

  const availablePotions = useMemo(() => {
    return playerInventory.
    filter((item) => item.itemType === 'potion' && item.quantity > 0).
    map((item) => ({
      itemKey: item.itemKey,
      details: POTIONS[item.itemKey],
      quantity: item.quantity
    }));
  }, [playerInventory]);

  // --- Data Normalization (same as in BattleScene) ---
  const normalizeStats = (mon) => {
    if (!mon) return { currentHp: 0, maxHp: 0, currentMp: 0, maxMp: 0 };
    const maxHp = mon.maxHp || mon.stats?.hp || 0;
    const currentHp = mon.currentHp ?? maxHp;
    const maxMp = mon.maxMp || (mon.stats ? Math.floor(mon.stats.sp_attack * 0.8) + 20 : 50);
    const currentMp = mon.currentMp ?? maxMp;
    return { currentHp, maxHp, currentMp, maxMp };
  };

  // Handle monster selection for potions
  const handleMonsterSelect = (monId) => {
    if (selectedMonsterForPotion === monId) {
      setSelectedMonsterForPotion(null); // Deselect if already selected
    } else {
      setSelectedMonsterForPotion(monId);
    }
  };

  // Handle potion use
  const handlePotionSelection = (monsterId, potionKey) => {
    onUsePotion(monsterId, potionKey);
    setSelectedMonsterForPotion(null); // Deselect after using potion
  };

  const isSwitching = !!onSelect;

  const handleMove = (e, index, direction) => {
    e.stopPropagation(); // Prevent card click
    if (!onReorderTeam) {
      console.warn("onReorderTeam is not provided to TeamScreen.");
      return;
    }

    const targetIndex = direction === 'up' ? index - 1 : index + 1;

    if (targetIndex < 0 || targetIndex >= team.length) {
      console.log(`TeamScreen: Cannot move monster at index ${index} ${direction}. Target index ${targetIndex} is out of bounds.`);
      return;
    }

    const newTeam = [...team];
    // Simple swap
    [newTeam[index], newTeam[targetIndex]] = [newTeam[targetIndex], newTeam[index]];

    console.log(`TeamScreen: Swapped monster at index ${index} with ${targetIndex}. New team order:`, newTeam.map(m => m.name));
    onReorderTeam(newTeam);
  };

  return (
    <div className="flex-1 bg-retro-bg p-4 flex flex-col">
            <div className="flex justify-between items-center mb-4 text-white">
                <h2 className="text-xl font-bold pixel-text-shadow">{isSwitching ? '选择替换的宝可梦' : '我的队伍'}</h2>
                <button onClick={onBack} className="text-sm border border-white px-2 py-1 hover:bg-white hover:text-black">返回</button>
            </div>
            <div className="flex-1 overflow-y-auto space-y-3 pr-1">
                {team.map((mon, index) => {
          const stats = normalizeStats(mon);
          const isFainted = stats.currentHp === 0;
          const isActive = activeId === mon.id;
          const canSelect = !isFainted && !isActive;

          const handleCardClick = () => {
            if (isSwitching) {
              if (canSelect) {
                onSelect(mon.id);
                onBack(); // Close TeamScreen after a successful switch
              }
              // Do nothing if cannot select in switch mode
            } else {
              handleMonsterSelect(mon.id);
            }
          };

          return (
            <PixelCard
              key={mon.id}
              onClick={handleCardClick}
              active={isActive || !isSwitching && selectedMonsterForPotion === mon.id}
              className={`${isFainted ? 'opacity-50 grayscale' : ''} ${isSwitching && !canSelect ? 'cursor-not-allowed' : ''}`}>

                            <div className="flex items-center gap-3">
                                <div className="w-12 h-12 flex-shrink-0 bg-black/10 rounded-full flex items-center justify-center">
                                    <img src={mon.sprite} alt={mon.name} className="w-10 h-10 object-contain" style={{ imageRendering: 'pixelated' }} />
                                </div>
                                <div className="flex-1">
                                    <div className="flex justify-between items-center">
                                        <span className="font-bold">{mon.name}</span>
                                        <div className="flex gap-1">
                                            {mon.type2 && <TypeBadge type={mon.type2} />}
                                            <TypeBadge type={mon.type} />
                                        </div>
                                    </div>
                                    <div className="mt-1 space-y-1">
                                        <ProgressBar current={stats.currentHp} max={stats.maxHp} />
                                        <ProgressBar current={stats.currentMp} max={stats.maxMp} color="bg-blue-500" />
                                    </div>
                                    <div className="flex justify-between text-xs mt-1 text-gray-600">
                                        <span>体力: {stats.currentHp}/{stats.maxHp}</span>
                                        <span>能量: {stats.currentMp}/{stats.maxMp}</span>
                                    </div>
                                    <ProgressBar current={mon.currentExp} max={mon.expToNextLevel} color="bg-orange-500" />
                                    <div className="flex justify-between text-xs mt-0.5 text-gray-600">
                                        <span>经验: {mon.currentExp}/{mon.expToNextLevel}</span>
                                        <span>Lv.{mon.level}</span>
                                    </div>
                                </div>
                                {!isSwitching &&
                <div className="flex flex-col gap-1.5 self-stretch">
                                        <button onClick={(e) => handleMove(e, index, 'up')} disabled={index === 0} className="w-6 h-6 flex items-center justify-center bg-gray-600 text-white rounded border-b-2 border-black active:border-b-0 active:translate-y-0.5 disabled:opacity-30 disabled:cursor-not-allowed">
                                            <i className="fa-solid fa-arrow-up"></i>
                                        </button>
                                        <button onClick={(e) => handleMove(e, index, 'down')} disabled={index === team.length - 1} className="w-6 h-6 flex items-center justify-center bg-gray-600 text-white rounded border-b-2 border-black active:border-b-0 active:translate-y-0.5 disabled:opacity-30 disabled:cursor-not-allowed">
                                            <i className="fa-solid fa-arrow-down"></i>
                                        </button>
                                    </div>
                }
                            </div>

                            {/* Potion selection UI is hidden during switching */}
                            {!isSwitching && selectedMonsterForPotion === mon.id && availablePotions.length > 0 &&
              <div className="mt-2 pt-2 border-t border-black/10 flex flex-wrap gap-2 justify-end">
                                    {availablePotions.map((potion) =>
                <button
                  key={potion.itemKey}
                  onClick={(e) => {
                    e.stopPropagation(); // Prevent card from deselecting
                    handlePotionSelection(mon.id, potion.itemKey);
                  }}
                  disabled={stats.currentHp === stats.maxHp}
                  className="bg-green-500 text-white text-xs px-3 py-1 rounded font-bold hover:bg-green-600 disabled:opacity-50 disabled:cursor-not-allowed border-2 border-black shadow-pixel-sm active:translate-y-1 active:shadow-none">

                                            使用 {potion.details.name} (x{potion.quantity})
                                        </button>
                )}
                                </div>
              }
                            {!isSwitching && selectedMonsterForPotion === mon.id && availablePotions.length === 0 &&
              <div className="mt-2 pt-2 border-t border-black/10 text-center text-xs text-gray-600">
                                    没有可用的药剂。
                                </div>
              }
                        </PixelCard>);

        })}
            </div>
        </div>);

};

                                            <div className="font-bold text-lg">{item.name}</div>
                                            <div className="flex items-center gap-1 text-sm text-gray-700 mt-1">
                                                <i className="fa-solid fa-coins text-yellow-600"></i>
                                                <span>{item.price}</span>
                                            </div>
                                        </div>
                                        <div className="flex flex-col items-end gap-1">
                                            <div className="text-sm text-gray-600">持有: {currentQuantity}</div>
                                            <button
                      onClick={() => onPurchase(itemType, key, 1)}
                      disabled={playerGold < item.price}
                      className="bg-yellow-500 text-black px-4 py-1 rounded font-bold hover:bg-yellow-500 disabled:opacity-50 disabled:cursor-not-allowed border-2 border-yellow-500 shadow-pixel-sm active:translate-y-1 active:shadow-none">

                                                购买
                                            </button>
                                        </div>
                                    </div>
                                </PixelCard>);

          })}
                    </React.Fragment>
        )}
            </div>
        </div>);

};

const BagScreen = ({ playerInventory = [], activePlayerMon, activeEnemyMon, onUseItem, onBack, addLog, turn, playerTeam = [], onUsePotion }) => {
  // Determine if we are in battle context (activeEnemyMon exists)
  const isBattle = !!activeEnemyMon;
  // Fallback to active mon if team is missing
  const effectiveTeam = playerTeam && playerTeam.length > 0 ? playerTeam : (activePlayerMon ? [activePlayerMon] : []);

  return (
    <UnifiedBagScreen
      inventory={playerInventory}
      onClose={onBack}
      onUseItem={onUseItem}
      onUsePotion={onUsePotion}
      team={effectiveTeam}
      isBattle={isBattle}
      activeMonId={activePlayerMon?.id}
      addLog={addLog}
    />
  );
};


// --- Main App Logic ---
const SAVE_GAME_KEY = 'pixelmon_save_data';

const loadGame = () => {
  try {
    const savedData = window.localStorage.getItem(SAVE_GAME_KEY);
    if (savedData) {
      const parsed = JSON.parse(savedData);
      // Basic validation to ensure we're loading a valid object
      if (parsed && typeof parsed === 'object' && Array.isArray(parsed.playerTeam)) {
        return parsed;
      }
    }
  } catch (e) {
    console.error("Failed to load game data:", e);
    window.localStorage.removeItem(SAVE_GAME_KEY); // Clear potentially corrupted data
  }
  return null;
};

  const initialPlayerMonsters = useMemo(() => [

  const [notifications, setNotifications] = useState([]);

  // --- Core Game Logic Callbacks ---

  }, []);

  // --- Game Save/Load and Initialization Effects ---
  useEffect(() => {

              addLog(`${updatedMon.name} 升级了! (Lv.${updatedMon.level} -> Lv.${updatedMon.level + 1})`);

  const handleGoToLaunchScreen = useCallback(() => {

  const activePlayerMon = useMemo(() => playerTeam.find((m) => m.id === activePlayerId), [playerTeam, activePlayerId]);

  // (All handlers like handleTurn, handleEncounter, etc. remain largely the same)
  const handleTurn = async (moveKey) => {

    addLog(`${activePlayerMon.name} 使用了 ${move.name}!`);

    // Short delay for impact
    await new Promise((r) => setTimeout(r, 600)); // Delay for log entry

    // Calc Dmg
    if (move.category !== 'status') {
      const result = calculateDamage(activePlayerMon, activeEnemyMon, move);

      // Update Enemy State
      setEnemyTeam((prev) => prev.map((m) => m.id === activeEnemyId ? { ...m, currentHp: newHp } : m));

      if (result.effectiveness > 1) addLog("效果绝佳！");

      await new Promise((r) => setTimeout(r, 500)); // Delay for attack effect to show

      if (newHp === 0) {
        addLog(`${activeEnemyMon.name} 倒下了！`);

if (newHp === 0) {

        });

        if (winningParticipants.length > 0) {

             } else {
                 addLog(`队伍获得了 ${baseXp} 总经验 (由 ${winningParticipants.length} 只宝可梦平分)!`);

            // Reset participated mons for the new enemy (optional, but keeping it simple usually means carrying over or resetting)
            // Typically in pokemon, participants are per-enemy-kill. We keep the list accumulated?
            // Actually my XP logic above runs ON KILL. So I should probably reset `participatedMonIds` for the NEXT kill calculation.
            setParticipatedMonIds([activePlayerId]);

        setEnemyTeam([]);
        setActiveEnemyId(null);
        addLog('你回到了地图上。');
        setView('map');
        setTurn('player');

      }

        const baseXp = Math.floor(activeEnemyMon.level * 15 + Math.random() * 10);
        const uniqueParticipants = [...new Set([...participatedMonIds, activePlayerId])];
        const winningParticipants = uniqueParticipants.filter(id => {

             return mon && mon.currentHp > 0;
        });

        if (winningParticipants.length > 0) {
             const xpPerMon = Math.floor(baseXp / winningParticipants.length);
             if (winningParticipants.length === 1) {
                 addLog(`${playerTeam.find(m => m.id === winningParticipants[0]).name} 获得了 ${baseXp} 经验值!`);
             } else {
                 addLog(`队伍获得了 ${baseXp} 总经验 (由 ${winningParticipants.length} 只宝可梦平分)!`);

        const newHp = Math.min(activePlayerMon.maxHp, activePlayerMon.currentHp + healAmount);
        setPlayerTeam((prev) => prev.map((m) => m.id === activePlayerId ? { ...m, currentHp: newHp } : m));

const handleEncounter = useCallback((suggestedWildLevel, terrainType) => {
    // 筛选池：随着层级提高，稀有度增加
    // mapLevel 1-2: ID 1-30 (基础)
    // mapLevel 3-5: ID 1-50 (中阶)
    // mapLevel 6+: ID 1-69 (全图鉴/传说)
    let filteredMonsters = MONSTERS;
    if (mapLevel <= 2) {
      filteredMonsters = MONSTERS.filter(m => m.id <= 30);
    } else if (mapLevel <= 5) {
      filteredMonsters = MONSTERS.filter(m => m.id <= 50);
    }

    const randomBaseMonster = filteredMonsters[Math.floor(Math.random() * filteredMonsters.length)];
    const playerAvgLevel = playerTeam.reduce((sum, mon) => sum + mon.level, 0) / playerTeam.length;
    
    // 等级随层级提升：每层基础等级+2
    const levelBonus = (mapLevel - 1) * 2;
    const newEnemyLevel = Math.max(1, Math.floor(playerAvgLevel) - 1 + Math.floor(Math.random() * 3) + levelBonus);
    const newEnemyInstance = createMonsterInstance(randomBaseMonster, newEnemyLevel, `e${nextEnemyMonsterId}`);

    setEnemyTeam([newEnemyInstance]);
    setActiveEnemyId(newEnemyInstance.id);
    setNextEnemyMonsterId((prev) => prev + 1);
    setParticipatedMonIds([activePlayerId]);

    setLogs([`在 Lv.${mapLevel} 地图遇到了野生的 ${newEnemyInstance.name} (Lv.${newEnemyInstance.level}) !`]);
    setView('battle');
  }, [playerTeam, nextEnemyMonsterId, getBaseMonsterDefinition, activePlayerId, mapLevel]);

  const handlePurchase = (itemType, itemKey, amount) => {
    let itemDetails = itemType === 'pokeball' ? POKEBALLS[itemKey] : POTIONS[itemKey];
    if (!itemDetails) { addLog("商店: 无效的物品。"); return; }
    if (playerGold < itemDetails.price * amount) { addLog("商店: 金币不足。"); return; }
    setPlayerGold((prev) => prev - itemDetails.price * amount);
    setPlayerInventory((prev) => {
      const existingItem = prev.find((i) => i.itemKey === itemKey && i.itemType === itemType);
      if (existingItem) {
        return prev.map((i) => i.itemKey === itemKey && i.itemType === itemType ? { ...i, quantity: i.quantity + amount } : i);
      }
      return [...prev, { itemType, itemKey, quantity: amount }];
    });
    addLog(`商店: 购买了 ${amount} 个 ${itemDetails.name}。`);
  };

const handleCollect = useCallback((type, amount) => {
    if (type === 'gold') {
      const goldAmount = amount || 50;
      setPlayerGold((prev) => prev + goldAmount);
      addNotification(`获得: ${goldAmount} 金币!`, 'gold');
    } else if (type === 'item') {
      const allItems = [...Object.keys(POKEBALLS), ...Object.keys(POTIONS)];
      const randomKey = allItems[Math.floor(Math.random() * allItems.length)];
      const isBall = !!POKEBALLS[randomKey];
      const itemType = isBall ? 'pokeball' : 'potion';
      const itemDetails = isBall ? POKEBALLS[randomKey] : POTIONS[randomKey];

      setPlayerInventory((prev) => {
        const existing = prev.find((i) => i.itemKey === randomKey && i.itemType === itemType);
        if (existing) {
          return prev.map((i) => i.itemKey === randomKey && i.itemType === itemType ? { ...i, quantity: i.quantity + 1 } : i);
        }
        return [...prev, { itemType, itemKey: randomKey, quantity: 1 }];
      });
      addNotification(`获得: ${itemDetails.name}!`, 'item');
    } else if (type === 'heal') {
      setPlayerTeam((prev) => prev.map(m => ({ ...m, currentHp: m.maxHp, currentMp: m.maxMp })));
      addNotification("队伍全员体力已恢复!", 'info');
} else if (type === 'info') {
      const tips = [
        "深色高草丛里的野生宝可梦更多且更强。",
        "沙地走起来比较费劲，但可能有隐藏宝藏。",
        "看到果树记得采集，果实可以恢复少量体力。",
        "神秘商人有时会带着罕见的宝可梦出现。",
        "属性克制是获胜的关键。",
        "队伍首位的宝可梦会首先出战。"
      ];
      const tip = tips[Math.floor(Math.random() * tips.length)];
      addNotification(`提示: ${tip}`, 'info');
    } else if (type === 'berry') {
      const healAmount = 20;
      setPlayerTeam(prev => prev.map(m => ({ ...m, currentHp: Math.min(m.maxHp, m.currentHp + healAmount) })));
      addNotification(`采集到甜甜蜜果: 全员恢复了 ${healAmount} 点体力!`, 'item');
    } else if (type === 'merchant') {
      const gifts = [
        { name: '超级球', action: () => handlePurchase('pokeball', 'pokeball_great', 0) }, // 免费赠送逻辑
        { name: '大量金币', action: () => setPlayerGold(prev => prev + 200) }
      ];
      const gift = gifts[Math.floor(Math.random() * gifts.length)];
      gift.action();
      addNotification(`神秘商人赠送了: ${gift.name}!`, 'gold');
    } else if (type === 'trainer') {
      const trainerTeamSize = Math.floor(Math.random() * 2) + 2; // 2 or 3 mons
      const newTeam = [];
      const playerAvgLevel = playerTeam.reduce((sum, mon) => sum + mon.level, 0) / playerTeam.length;

      for(let i=0; i<trainerTeamSize; i++) {
          const randomBase = MONSTERS[Math.floor(Math.random() * MONSTERS.length)];
          const level = Math.max(1, Math.floor(playerAvgLevel) + Math.floor(Math.random() * 3) - 1);
          // Use a temporary ID generator for trainer mons
          const id = `t${Date.now()}_${i}`;
          newTeam.push(createMonsterInstance(randomBase, level, id));
      }

      setEnemyTeam(newTeam);
      setActiveEnemyId(newTeam[0].id);
      setParticipatedMonIds([activePlayerId]);
      setLogs([`训练家向你发起了挑战!`, `对方派出了 ${newTeam[0].name} (Lv.${newTeam[0].level})!`]);
      setView('battle');
    }
  }, [addNotification, playerTeam, activePlayerId]);

  const handleUseItem = async (itemKey) => {
    if (turn !== 'player' || gameOver) return;
    const inventoryItem = playerInventory.find((i) => i.itemKey === itemKey && i.itemType === 'pokeball');
    if (!inventoryItem || inventoryItem.quantity <= 0) { addLog("背包: 没有此精灵球。"); return; }
    const pokeball = POKEBALLS[itemKey];
    if (!pokeball) { addLog("背包: 无效的精灵球。"); return; }

    setView('battle');
    addLog(`${activePlayerMon.name} 使用了 ${pokeball.name}!`);
    setIsThrowingPokeball(true);
    await new Promise((r) => setTimeout(r, 1200));

    setPlayerInventory((prev) => prev.map((i) => i.itemKey === itemKey && i.itemType === 'pokeball' ? { ...i, quantity: i.quantity - 1 } : i).filter((i) => i.quantity > 0));

    const baseCatchRate = 50;
    const hpFactor = (activeEnemyMon.maxHp - activeEnemyMon.currentHp) / activeEnemyMon.maxHp;
    const mpFactor = (activeEnemyMon.maxMp - activeEnemyMon.currentMp) / activeEnemyMon.maxMp;
    let finalCatchRate = (baseCatchRate + hpFactor * 20 + mpFactor * 10) * pokeball.catchRateMultiplier;
    finalCatchRate = Math.min(finalCatchRate, 95);

    if (Math.random() * 100 < finalCatchRate) {
      addLog(`成功捕捉到 ${activeEnemyMon.name}!`);
      const caughtMonster = {
        ...activeEnemyMon, id: `p${nextPlayerMonsterId}`, currentHp: activeEnemyMon.maxHp, currentMp: activeEnemyMon.maxMp,
        currentExp: 0, expToNextLevel: getExpToNextLevel(activeEnemyMon.level)
      };
      setPlayerTeam((prev) => {
          const healedOldTeam = prev.map(m => ({ ...m, currentHp: m.maxHp, currentMp: m.maxMp }));
          return [...healedOldTeam, caughtMonster];
      });
      addLog('队伍全员回复了体力与能量！');
      setNextPlayerMonsterId((prev) => prev + 1);
      addLog(`${caughtMonster.name} 已被传送到你的队伍中!`);

      const baseXp = Math.floor(activeEnemyMon.level * 15 + Math.random() * 10);
      const uniqueParticipants = [...new Set([...participatedMonIds, activePlayerId])];
      const winningParticipants = uniqueParticipants.filter(id => {
           const mon = playerTeam.find(m => m.id === id);
           return mon && mon.currentHp > 0;
      });

      if (winningParticipants.length > 0) {
           const xpPerMon = Math.floor(baseXp / winningParticipants.length);
           if (winningParticipants.length === 1) {
               addLog(`${playerTeam.find(m => m.id === winningParticipants[0]).name} 获得了 ${baseXp} 经验值 (捕获)!`);
           } else {
               addLog(`队伍获得了 ${baseXp} 总经验 (捕获，由 ${winningParticipants.length} 只宝可梦平分)!`);
           }
           winningParticipants.forEach(pid => gainExpAndLevelUp(pid, xpPerMon));
      }

      await new Promise((r) => setTimeout(r, 2000));
      setEnemyTeam([]);
      setActiveEnemyId(null);
      addLog('你回到了地图上。');
      setView('map');
      setTurn('player');
    } else {
      addLog(`哎呀！${activeEnemyMon.name} 挣脱了！`);
      setTurn('enemy');
    }
  };

  const handleRun = () => {
    if (turn !== 'player') return;
    addLog('你尝试逃跑...');
    if (Math.random() < 0.75) {
      addLog('成功逃跑了!');
      setTimeout(() => {
        setView('map');
        setEnemyTeam([]);
        setActiveEnemyId(null);
        setLogs(['你回到了地图上。']);
      }, 1500);
    } else {
      addLog('逃跑失败!');
      setTimeout(() => setTurn('enemy'), 1000);
    }
  };

  const handleUsePotion = useCallback((monsterId, potionKey) => {
    const potion = POTIONS[potionKey];
    if (!potion) { addLog("药剂: 无效的药剂。"); return; }
    const inventoryItem = playerInventory.find((i) => i.itemType === 'potion' && i.itemKey === potionKey);
    if (!inventoryItem || inventoryItem.quantity <= 0) { addLog("药剂: 没有此药剂。"); return; }

    setPlayerTeam((prevTeam) => {
      const targetMon = prevTeam.find((m) => m.id === monsterId);
      if (!targetMon || targetMon.currentHp === targetMon.maxHp) {
        if (targetMon) addLog(`${targetMon.name} 的体力已满。`);
        return prevTeam;
      }
      const newHp = Math.min(targetMon.maxHp, targetMon.currentHp + potion.healAmount);
      addLog(`${targetMon.name} 恢复了 ${newHp - targetMon.currentHp} 点体力！`);
      setPlayerInventory((prevInv) => prevInv.map((i) => i.itemType === 'potion' && i.itemKey === potionKey ? { ...i, quantity: i.quantity - 1 } : i).filter((i) => i.quantity > 0));
      return prevTeam.map((m) => m.id === monsterId ? { ...m, currentHp: newHp } : m);
    });
  }, [playerInventory, addLog]);

const handleReorderTeam = useCallback((newTeam) => {
    setPlayerTeam(newTeam);
    if (newTeam.length > 0 && newTeam[0].id !== activePlayerId) {
      setActivePlayerId(newTeam[0].id);
      addLog(`首发宝可梦已切换为 ${newTeam[0].name}!`);
    } else {
      addLog("队伍顺序已调整。");
    }
  }, [addLog, activePlayerId]);

  // Effect to control body scrolling based on current view
  useEffect(() => {
    const nonScrollingViews = ['map', 'battle'];
    if (showLaunchScreen || nonScrollingViews.includes(view)) {
      document.body.style.overflow = 'hidden';
      document.documentElement.style.overflow = 'hidden';
    } else {
      document.body.style.overflow = '';
      document.documentElement.style.overflow = '';
    }
  }, [showLaunchScreen, view]);

  useEffect(() => {
    if (turn === 'enemy' && !gameOver && activeEnemyMon && activeEnemyMon.currentHp > 0 && !isThrowingPokeball) {
      const timer = setTimeout(async () => {
        const currentEnemyMon = enemyTeam.find(m => m.id === activeEnemyId);
        const currentPlayerMon = playerTeam.find(m => m.id === activePlayerId);
        if (!currentEnemyMon || !currentPlayerMon) { if (!gameOver) setTurn('player'); return; }

        const affordableMoves = currentEnemyMon.moves.filter((mk) => MOVES[mk].cost <= currentEnemyMon.currentMp);
        if (affordableMoves.length === 0) {
          addLog(`敌方 ${currentEnemyMon.name} 能量不足，无法行动!`);
          if (!gameOver) setTurn('player'); return;
        }
        const randomMoveKey = affordableMoves[Math.floor(Math.random() * affordableMoves.length)];
        const move = MOVES[randomMoveKey];
        setEnemyTeam((prev) => prev.map((m) => m.id === currentEnemyMon.id ? { ...m, currentMp: m.currentMp - move.cost } : m));
        addLog(`敌方 ${currentEnemyMon.name} 使用了 ${move.name}!`);
        await new Promise((r) => setTimeout(r, 600));

        if (move.category !== 'status') {
          const result = calculateDamage(currentEnemyMon, currentPlayerMon, move);
          const newHp = Math.max(0, currentPlayerMon.currentHp - result.damage);
          setPlayerTeam((prev) => prev.map((m) => m.id === currentPlayerMon.id ? { ...m, currentHp: newHp } : m));
          if (result.effectiveness > 1) addLog("效果绝佳！");
          if (result.effectiveness < 1) addLog("效果不理想...");
          if (newHp === 0) {
            addLog(`${currentPlayerMon.name} 倒下了！`);
            const hasAlive = playerTeam.some((m) => m.id !== currentPlayerMon.id && m.currentHp > 0);
            if (!hasAlive) { setGameOver(true); addLog("你输了... 眼前一黑。"); } else { setView('team'); }
          }
        } else if (move.effect === 'heal') {
            const healAmount = Math.floor(currentEnemyMon.maxHp / 2);
            const newHp = Math.min(currentEnemyMon.maxHp, currentEnemyMon.currentHp + healAmount);
            setEnemyTeam((prev) => prev.map((m) => m.id === currentEnemyMon.id ? { ...m, currentHp: newHp } : m));
            addLog(`${currentEnemyMon.name} 恢复了体力！`);
        }
        if (!gameOver) setTurn('player');
      }, 1500);
      return () => clearTimeout(timer);
    }
  }, [turn, gameOver, playerTeam, enemyTeam, activePlayerId, activeEnemyId, isThrowingPokeball, addLog]);

  const handleSwitch = (newId) => {
    const isForced = activePlayerMon && activePlayerMon.currentHp <= 0;
    const newMonster = playerTeam.find((m) => m.id === newId);
    if (!newMonster || newMonster.currentHp <= 0 || newId === activePlayerId) { addLog("无法切换到该宝可梦。"); return; }
    const oldMonName = activePlayerMon ? activePlayerMon.name : '宝可梦';
    setParticipatedMonIds((prev) => [...prev, activePlayerId]);
    setActivePlayerId(newId);
    addLog(`回来吧 ${oldMonName}! 去吧 ${newMonster.name}!`);
    if (!isForced) setTurn('enemy');
  };

const handleStartGame = useCallback(() => setShowLaunchScreen(false), []);

  const handleSelectLevel = (level) => {
    setMapLevel(level);
    if (level > maxReachedLevel) {
      setMaxReachedLevel(level);
    }
    // 修复：传入当前选中的层级 ID，以生成或从缓存加载对应的地图
    MAP_GRID = generateMaze(20, 15, level);
    setPlayerPos({ x: 1, y: 1 });
    setView('map');
    addNotification(`进入了层级 ${level}`, 'info');
  };

  if (showLaunchScreen) return <LaunchScreen onStartGame={handleStartGame} />;
  if (!activePlayerMon) return <div className="text-white bg-retro-bg flex items-center justify-center h-full">加载中...</div>;
  if (view === 'battle' && !activeEnemyMon) return <div className="text-white bg-retro-bg flex items-center justify-center h-full">遭遇战...</div>;

  return (
    <div className="h-full w-full max-w-md mx-auto flex flex-col bg-retro-bg shadow-2xl relative">
      <NotificationToast notifications={notifications} />
      <div className="flex-1 min-h-0 flex flex-col relative z-10">
        {view === 'map' && <MapScreen playerTeam={playerTeam} onEncounter={handleEncounter} onNavigate={setView} onCollect={handleCollect} playerPos={playerPos} onPlayerMove={setPlayerPos} />}
        {view === 'battle' && activeEnemyMon && <BattleScene playerMon={activePlayerMon} enemyMon={activeEnemyMon} logs={logs} playerGold={playerGold} onMove={handleTurn} onSwitch={handleSwitch} turn={turn} onNavigate={setView} onRun={handleRun} playerTeam={playerTeam} playerInventory={playerInventory} onUseItem={handleUseItem} onUsePotion={handleUsePotion} addLog={addLog} isThrowingPokeball={isThrowingPokeball} onPokeballAnimationEnd={handlePokeballAnimationEnd} onGoToLaunchScreen={handleGoToLaunchScreen} />}
        {view === 'team' && <TeamScreen team={playerTeam} activeId={activePlayerId} onSelect={activeEnemyMon ? handleSwitch : undefined} onBack={() => setView(activeEnemyMon ? 'battle' : 'map')} playerInventory={playerInventory} onUsePotion={handleUsePotion} onReorderTeam={handleReorderTeam} />}
        {view === 'dex' && <DexScreen onBack={() => setView('map')} />}
        {view === 'shop' && <ShopScreen playerGold={playerGold} playerInventory={playerInventory} onPurchase={handlePurchase} onBack={() => setView('map')} />}
        {view === 'bag' && <BagScreen playerInventory={playerInventory} playerTeam={playerTeam} activePlayerMon={activePlayerMon} activeEnemyMon={activeEnemyMon} onUseItem={handleUseItem} onUsePotion={handleUsePotion} onBack={() => setView(activeEnemyMon ? 'battle' : 'map')} addLog={addLog} turn={turn} />}
        {view === 'levelSelect' && (
          <div className="absolute inset-0 bg-black/90 z-50 flex flex-col items-center justify-center p-6">
            <div className="bg-retro-panel pixel-border p-6 w-full max-w-xs text-center">
              <h2 className="text-xl font-bold mb-4 text-black flex items-center justify-center gap-2">
                <i className="fa-solid fa-stairs"></i> 选择地图层级
              </h2>
              <div className="grid grid-cols-3 gap-2 max-h-64 overflow-y-auto no-scrollbar mb-6 p-1">
                {Array.from({ length: maxReachedLevel }, (_, i) => i + 1).map(lv => (
                  <button
                    key={lv}
                    onClick={() => handleSelectLevel(lv)}
                    className={`h-12 border-2 border-black rounded font-bold shadow-pixel-sm active:shadow-none active:translate-y-0.5 transition-all ${
                      lv === mapLevel ? 'bg-retro-blue text-white' : 'bg-white hover:bg-gray-100'
                    }`}
                  >
                    {lv}
                  </button>
                ))}
                <button
                  onClick={() => handleSelectLevel(maxReachedLevel + 1)}
                  className="h-12 bg-retro-green text-white border-2 border-black rounded font-bold shadow-pixel-sm active:shadow-none active:translate-y-0.5 animate-pulse"
                >
                  新层级
                </button>
              </div>
              <button
                onClick={() => setView('map')}
                className="w-full py-2 bg-gray-500 text-white rounded border-2 border-black shadow-pixel-sm active:translate-y-1"
              >
                返回
              </button>
            </div>
          </div>
        )}
        {gameOver && <div className="absolute inset-0 bg-black/80 flex items-center justify-center flex-col z-50 animate-bounce-in">
          <div className="bg-retro-panel p-6 border-4 border-white rounded text-center">
            <h2 className="text-2xl font-bold mb-4">{playerTeam.some((m) => m.currentHp > 0) ? '胜利!' : '失败'}</h2>
            <button onClick={handleGoToLaunchScreen} className="bg-retro-accent text-white px-6 py-2 rounded font-bold hover:bg-red-600 border-2 border-black shadow-pixel-sm active:translate-y-1 active:shadow-none">
              重新开始
            </button>
          </div>
        </div>}
      </div>
    </div>
  );
};


// --- Notification System ---
const NotificationToast = ({ notifications }) => {
  if (notifications.length === 0) return null;

  return (
    <div className="fixed top-16 left-1/2 transform -translate-x-1/2 z-[9000] flex flex-col gap-2 w-full max-w-sm pointer-events-none px-4">
      {notifications.map((notif) =>
      <div key={notif.id} className="bg-retro-panel border-4 border-black p-3 shadow-pixel animate-bounce-in flex items-center gap-3 pixel-border relative">
            <div className={`shrink-0 w-10 h-10 rounded-full flex items-center justify-center border-2 border-black ${notif.type === 'gold' ? 'bg-yellow-400' : 'bg-blue-400'}`}>
                <i className={`fa-solid ${notif.type === 'gold' ? 'fa-coins text-yellow-900' : 'fa-gift text-white'} text-lg`}></i>
            </div>
            <div className="flex-1 font-bold font-mono text-gray-800 leading-tight">
                {notif.message}
            </div>
            {/* Corner decorations */}
            <div className="absolute top-0 left-0 w-1 h-1 bg-white/50"></div>
        </div>
      )}
    </div>);

};

const GameRoot = ({ children }) => {
  const [notifications, setNotifications] = useState([]);

  const addNotification = useCallback((message) => {
    const id = Date.now() + Math.random();
    // Determine type based on content
    const type = message.includes('金币') || message.includes('Gold') ? 'gold' : 'item';
    // Clean up debug text if present
    const cleanMessage = message.replace('(需完善App逻辑以保存)', '').replace('获得:', '获得: ').trim();

    setNotifications((prev) => [...prev, { id, message: cleanMessage, type }]);

    // Auto remove after 3 seconds
    setTimeout(() => {
      setNotifications((prev) => prev.filter((n) => n.id !== id));
    }, 3000);
  }, []);

  useEffect(() => {
    // Intercept window.alert for collection messages
    const originalAlert = window.alert;
    window.alert = (msg) => {
      // Check for collection messages (Gold or Items)
      if (typeof msg === 'string' && (msg.includes('获得:') || msg.includes('Found') || msg.includes('You got'))) {
        addNotification(msg);
      } else {
        originalAlert(msg);
      }
    };

    return () => {
      window.alert = originalAlert;
    };
  }, [addNotification]);

  return (
    <>
      {children}
      <NotificationToast notifications={notifications} />
    </>);

};

// Render
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(
  <ErrorBoundary>
        <GameRoot>
            <App />
        </GameRoot>
    </ErrorBoundary>
);;</script>

  <script>
      (function(){
          if(window.SPARK_VERTEX_ID) return;
          window.SPARK_VERTEX_ID = "garqlj6xkjs1vkiwrqxywk";
      })();
  </script>
</body>
